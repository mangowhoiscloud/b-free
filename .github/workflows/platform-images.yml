# [T7] Platform ECR mirror of the scanned images. No build here and no unscanned path:
#   images.yaml (push to main) builds -> SBOM (syft) -> scan (trivy, no OIDC) -> pushes to GHCR by digest and
#   uploads digests.json (name, digest, scan_passed, pushed). When that run succeeds, this workflow copies exactly
#   those pushed digests from GHCR to the platform ECR (bravo-platform/<name>) with skopeo --preserve-digests,
#   then reads each back by digest. An image whose scan did not pass, or that was not pushed, is not copied.
# Identity: GitHub OIDC -> role from infra/modules/ci_identity/aws, trusted only for
#   repo:mangowhoiscloud/b-free:ref:refs/heads/main, allowed only to push to bravo-platform/* (NFR-6, no stored key).
#   Repository variable PLATFORM_CI_ROLE_ARN = terraform -chdir=infra/envs/platform-aws output -raw ci_deploy_identity
# Deployment stays a pull: the platform Argo CD reads the digests from deploy/platform (D-16).
# Third-party actions are pinned by full commit SHA (TECH-STACK-SPEC 2.8).
name: platform-images

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "images.yaml run id whose digests.json to mirror (main, scans passed)"
        required: true

permissions: {}

concurrency:
  group: platform-images
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com
  GHCR_PREFIX: ghcr.io/mangowhoiscloud/b-free
  # images.yaml catalog name -> platform ECR repository bravo-platform/<name>
  PLATFORM_IMAGES: api console gate collector executor rehearsal

jobs:
  mirror:
    name: mirror scanned digests to ECR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write   # OIDC to the ECR push role
      actions: read     # digests.json artifact of the images run
      packages: read    # pull from GHCR by digest
    steps:
      # An images run whose plan found no changed image builds nothing and uploads no digests.json: nothing to mirror.
      - name: Does the images run have digests.json
        id: has
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "digests" and (.expired | not))] | length')"
          echo "digests=$n" >> "$GITHUB_OUTPUT"
          [[ $n != 0 ]] || echo "images run $RUN_ID built no image (no digests.json): nothing to mirror"

      - name: Download digests.json from the images run
        if: steps.has.outputs.digests != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: ${{ runner.temp }}/digests
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Select scanned and pushed digests
        id: sel
        if: steps.has.outputs.digests != '0'
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/digests/digests.json"
          jq -e '.images | type == "array"' "$f" >/dev/null
          : > "$RUNNER_TEMP/copy.tsv"
          for n in $PLATFORM_IMAGES; do
            row="$(jq -c --arg n "$n" '.images[] | select(.name == $n)' "$f")"
            if [[ -z $row ]]; then echo "$n: not built in this run, skipped"; continue; fi
            d="$(jq -r '.digest // ""' <<<"$row")"; ok="$(jq -r '.scan_passed // false' <<<"$row")"; pushed="$(jq -r '.pushed // ""' <<<"$row")"
            if [[ $ok != true || -z $pushed || $d != sha256:* ]]; then echo "$n: scan not passed or not pushed, NOT copied"; continue; fi
            printf '%s\t%s\n' "$n" "$d" >> "$RUNNER_TEMP/copy.tsv"
          done
          echo "count=$(wc -l < "$RUNNER_TEMP/copy.tsv" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: AWS credentials (OIDC)
        if: (steps.sel.outputs.count || '0') != '0'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLATFORM_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy GHCR -> ECR by digest (skopeo, digests preserved)
        if: (steps.sel.outputs.count || '0') != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ecr_pw="$(aws ecr get-login-password --region "$AWS_REGION")"
          printf '%s' "$ecr_pw" | skopeo login --username AWS --password-stdin "$ECR_REGISTRY" >/dev/null
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io >/dev/null
          {
            echo "| image | digest (scanned in images.yaml) | ECR |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r n d; do
            dst="$ECR_REGISTRY/bravo-platform/$n"
            # ECR tags are immutable: tag with the commit; the digest is what deploy/platform pins.
            skopeo copy --all --preserve-digests "docker://$GHCR_PREFIX/$n@$d" "docker://$dst:$SHA-$(echo "$d" | cut -c8-19)"
            got="$(skopeo inspect --raw "docker://$dst@$d" | sha256sum | awk '{print "sha256:" $1}')"
            [[ $got == "$d" ]] || { echo "$n: ECR digest $got != scanned $d"; exit 1; }
            echo "| \`$n\` | \`$d\` | \`$dst@$d\` |" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/copy.tsv"
