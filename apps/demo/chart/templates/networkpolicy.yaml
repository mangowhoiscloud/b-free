{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bravo-demo.fullname" . }}
  labels:
    {{- include "bravo-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bravo-demo.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- toYaml (.Values.networkPolicy.ingress | default list) | nindent 4 }}
  egress:
    {{- toYaml (.Values.networkPolicy.egress | default list) | nindent 4 }}
{{- end }}
