{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bravo-demo.fullname" . }}
  labels:
    {{- include "bravo-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bravo-demo.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.admin.allowedFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.admin.port }}
          protocol: TCP
    {{- end }}
  egress:
    {{- toYaml (.Values.networkPolicy.egress | default list) | nindent 4 }}
{{- end }}
