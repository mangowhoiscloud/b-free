[project]
name = "bravo-demo"
version = "0.1.0"
description = "Bravo demo app: real-time financial consultation chat that the platform migrates (T4, T22, §8.10)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "psycopg[binary,pool]==3.3.6",
  "boto3==1.43.123",
  "segno==1.6.6",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
]

[project.scripts]
bravo-demo = "bravo_demo.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "httpx==0.28.1", "ruff==0.17.3", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S608"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests start throwaway containers with the docker CLI and mount world-readable test configs.
"tests/*" = ["S603", "S607", "S103", "S105", "S106"]
