<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>금융 상담실</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <h1 data-i18n="title">금융 상담실</h1>
      <p class="sub" data-i18n="subtitle">상담사와 실시간으로 이야기해요</p>
    </div>
    <div class="badges">
      <span id="env" class="badge env" title=""><span class="dot"></span><span id="env-text">…</span></span>
      <span id="live" class="badge live off"><span class="dot"></span><span id="live-text">…</span></span>
      <button id="lang" class="lang" type="button" aria-label="언어">日本語</button>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

  <main id="list" class="list" aria-live="polite"></main>

  <form id="composer" class="composer" autocomplete="off">
    <div id="attach-chip" class="chip hidden">
      <span id="attach-name"></span>
      <button id="attach-clear" type="button" class="chip-x" aria-label="첨부 취소">×</button>
    </div>
    <div class="row">
      <label class="attach" id="attach-label">
        <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5 8.4 14.6a2 2 0 0 0 2.8 2.8l8.1-8.1a4 4 0 0 0-5.7-5.7L5.5 11.7a6 6 0 0 0 8.5 8.5l6.4-6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="sr" data-i18n="attach">파일 첨부</span>
      </label>
      <input id="text" type="text" maxlength="2000" data-i18n-placeholder="placeholder" placeholder="메시지를 입력하세요">
      <button id="send" type="submit" class="send" data-i18n="send">보내기</button>
    </div>
  </form>
</div>

<dialog id="name-dialog" class="dialog">
  <form method="dialog" id="name-form">
    <h2 data-i18n="welcome">어서 오세요</h2>
    <p data-i18n="askName">채팅에 보일 이름을 적어 주세요.</p>
    <input id="name-input" type="text" maxlength="40" required data-i18n-placeholder="namePlaceholder" placeholder="예: 김고객">
    <button type="submit" class="send" data-i18n="start">시작하기</button>
  </form>
</dialog>

<div id="toast" class="toast hidden" role="status" aria-live="assertive"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
