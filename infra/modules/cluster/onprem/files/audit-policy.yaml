# API audit policy for the on-prem destination (K3s CIS hardening guide, D-21 T2).
# Secrets, ConfigMaps and token reviews are logged at Metadata only: never request or response bodies.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]
  - level: None
    users: ["system:apiserver"]
    verbs: [get, list, watch]
  - level: None
    resources: [{group: coordination.k8s.io, resources: [leases]}]
    verbs: [get, update, watch]
  - level: Metadata
    resources:
      - {group: "", resources: [secrets, configmaps, serviceaccounts/token]}
      - {group: authentication.k8s.io, resources: [tokenreviews]}
  # Who exec'd or port-forwarded into what (Executor: pods/exec on PgBouncer, pods/portforward).
  - level: Metadata
    resources: [{group: "", resources: [pods/exec, pods/portforward, pods/attach]}]
  - level: Request
    verbs: [create, update, patch, delete, deletecollection]
    resources:
      - {group: rbac.authorization.k8s.io}
      - {group: networking.k8s.io}
      - {group: cilium.io}
      - {group: kyverno.io}
      - {group: policies.kyverno.io}
  - level: Metadata
