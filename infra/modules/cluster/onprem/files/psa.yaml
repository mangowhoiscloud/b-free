# Pod Security Admission defaults for the on-prem destination (K3s CIS hardening guide).
# Every namespace is "restricted" unless it carries its own pod-security labels.
# Only kube-system is exempt (Cilium, CoreDNS, local-path-provisioner live there).
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: restricted
        enforce-version: latest
        audit: restricted
        audit-version: latest
        warn: restricted
        warn-version: latest
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces: [kube-system]
