# OTel Collector agent (11-landing-zone.md 2절): apps send OTLP to otel-agent.bravo-observability.svc:4317;
# the agent forwards to the platform Collector through the link (Service platform-otel, bravo-link relay).
# No host mounts, so it runs under Pod Security "restricted".
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
  namespace: bravo-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
          http: {endpoint: "0.0.0.0:4318"}
      # Dataplane V2 (anetd, Cilium-based) flow metrics on this node (gcloud --enable-dataplane-v2-metrics, port
      # flowmetrics 9965, hostNetwork). Same Hubble counters as the other environments (15-r2-contracts 7.4).
      prometheus/hubble:
        config:
          scrape_configs:
            - job_name: hubble
              scrape_interval: 30s
              static_configs: [{targets: ["${env:NODE_IP}:9965"]}]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: hubble_(flows_processed_total|drop_total|tcp_flags_total|lost_events_total)
                  action: keep
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 200, spike_limit_mib: 50}
      resource:
        attributes:
          - {key: k8s.cluster.name, value: ${CLUSTER_NAME}, action: upsert}
          - {key: bravo.env, value: target-gcp, action: upsert}
          - {key: cloud.provider, value: gcp, action: upsert}
          - {key: cloud.region, value: ${REGION}, action: upsert}
      batch: {}
    exporters:
      otlp:
        endpoint: "platform-otel.bravo-observability.svc.cluster.local:4317"
        tls: {insecure: true}
    service:
      telemetry:
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus: {host: "0.0.0.0", port: 8888}
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp]}
        metrics: {receivers: [otlp, prometheus/hubble], processors: [memory_limiter, resource, batch], exporters: [otlp]}
        logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: bravo-observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: bravo-landing-zone
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/part-of: bravo-landing-zone
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otelcol
          image: ${OTEL_IMAGE}
          args: ["--config=/conf/config.yaml"]
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            tcpSocket: {port: otlp-grpc}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: otel-agent}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  namespace: bravo-observability
spec:
  selector:
    app.kubernetes.io/name: otel-agent
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
