# Secrets the landing zone needs, all from the platform OpenBao (D-26, CLOUD-E2E-CONTRACT §4, §8, §9).
#   secret/envs/target-gcp/chat-db         app_writer, replicator, executor_ctl, executor_observe, pgb_admin,
#                                          pgb_stats, db_owner (app_writer = source-aws value: one userlist
#                                          entry serves target-src before cutover and target-dst after)
#   secret/envs/target-gcp/chat-admin      token
#   secret/envs/target-gcp/object-store    bucket, endpoint_url, region, access_key_id, secret_access_key
#                                          (CLOUD-E2E-CONTRACT §9; GCS HMAC of SA chat-app)
#   secret/envs/target-gcp/cf-tunnel       token
# Same Secret names as the k3s overlay contract: bravo-demo-db, chat-admin, cf-tunnel. Only the S3
# credential Secret name follows the chart's gke values (bravo-demo-gcs-hmac).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-db-owner
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: chat-db-owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: chat_dbo
        password: "{{ .db_owner }}"
  data:
    - secretKey: db_owner
      remoteRef: {key: envs/target-gcp/chat-db, property: db_owner}
---
# App DB path: DSN without password (PgBouncer write path) + app_writer password file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bravo-demo-db
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: bravo-demo-db
    template:
      engineVersion: v2
      data:
        dsn: "host=chat-pgbouncer.chat.svc.cluster.local port=6432 dbname=chat user=app_writer"
        password: "{{ .app_writer }}"
  data:
    - secretKey: app_writer
      remoteRef: {key: envs/target-gcp/chat-db, property: app_writer}
---
# PgBouncer auth_file. Plain entries work with auth_type = scram-sha-256 (deploy/pilot/pgbouncer/render-config.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-pgbouncer-auth
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: chat-pgbouncer-auth
    template:
      engineVersion: v2
      data:
        userlist.txt: |
          "app_writer" "{{ .app_writer }}"
          "pgb_admin" "{{ .pgb_admin }}"
          "pgb_stats" "{{ .pgb_stats }}"
  data:
    - secretKey: app_writer
      remoteRef: {key: envs/target-gcp/chat-db, property: app_writer}
    - secretKey: pgb_admin
      remoteRef: {key: envs/target-gcp/chat-db, property: pgb_admin}
    - secretKey: pgb_stats
      remoteRef: {key: envs/target-gcp/chat-db, property: pgb_stats}
---
# Write-block switch bearer token (CLOUD-E2E-CONTRACT §8).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-admin
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: chat-admin
  data:
    - secretKey: token
      remoteRef: {key: envs/target-gcp/chat-admin, property: token}
---
# S3 contract credential for GCS (XML API, HMAC). Same keys as every environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bravo-demo-gcs-hmac
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: bravo-demo-gcs-hmac
  data:
    - secretKey: access-key-id
      remoteRef: {key: envs/target-gcp/object-store, property: access_key_id}
    - secretKey: secret-access-key
      remoteRef: {key: envs/target-gcp/object-store, property: secret_access_key}
---
# Cloudflare tunnel connector token (CLOUD-E2E-CONTRACT §3: Secret cf-tunnel, key token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-tunnel
  namespace: cf-edge
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bravo-platform-openbao}
  target:
    name: cf-tunnel
  data:
    - secretKey: token
      remoteRef: {key: envs/target-gcp/cf-tunnel, property: token}
