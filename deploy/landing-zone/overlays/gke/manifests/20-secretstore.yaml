# Secrets (D-26): ESO only. Values live in the platform OpenBao; this cluster pulls only its own path
# secret/envs/target-gcp/*. The address "openbao" is the bravo-link relay Service in this namespace
# (temporary link before D-16, laptop agent -> platform EKS openbao/openbao-0). The short name matches the
# platform OpenBao server certificate SAN (DNS:openbao), so TLS is verified end to end with the platform CA.
# AppRole eso-target-gcp: role_id and secret_id are delivered by infra/envs/target-gcp/scripts/secrets.sh
# through a pipe into Secret external-secrets/eso-target-gcp (never written to a file). Store and Secret names
# follow base/eso-store.yaml (bravo-platform-openbao, eso-<env>, keys role_id/secret_id).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bravo-platform-openbao
  labels:
    app.kubernetes.io/part-of: bravo-landing-zone
spec:
  conditions:
    - namespaces: ["chat", "cf-edge"]
  provider:
    vault:
      server: "https://openbao:8200"
      path: secret
      version: v2
      caBundle: ${BAO_CA_B64}
      auth:
        appRole:
          path: approle
          roleRef:
            name: eso-target-gcp
            namespace: external-secrets
            key: role_id
          secretRef:
            name: eso-target-gcp
            namespace: external-secrets
            key: secret_id
