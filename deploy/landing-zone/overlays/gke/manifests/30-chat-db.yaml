# CNPG Cluster chat-db (CLOUD-E2E-CONTRACT §3, §9): PostgreSQL 16, wal_level=logical,
# max_slot_wal_keep_size set, max_replication_slots >= 10, Service chat-db-rw:5432.
# No superuser Secret (enableSuperuserAccess: false). The database owner password comes from OpenBao (ESO).
# The chat schema (apps/demo/schema/sql 01 -> 02 -> 03_dst) is applied by the platform at bring-up.
# Gate DB-AUDIT (AUD-01): pgaudit ddl + role (CNPG adds pgaudit to shared_preload_libraries and creates the
# extension), log_connections and log_disconnections on.
# Gate DB-TLS (ENC-01): pg_hba takes TLS only (hostnossl ... reject, before CNPG's default "host all all all").
# Clients verify the CA and the name (sslmode=verify-full, CA bundle ConfigMap chat/bravo-db-ca from
# deploy/landing-zone/scripts/db-ca.sh). serverAltDNSNames adds the names clients use besides chat-db-rw.*:
#   gke-db.bravo-link.svc[.cluster.local]  platform D-16 link t1-gke-db
#   chat-pgbouncer.chat.svc[.cluster.local]  the app -> PgBouncer (PgBouncer serves this certificate, 31-pgbouncer.yaml)
# projectedVolumeTemplate: the CA bundle at /projected/db-ca/ca.crt for a subscription (sslrootcert); optional so
# the instance starts before db-ca.sh has run.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chat-db
  namespace: chat
  labels:
    app.kubernetes.io/part-of: bravo-landing-zone
spec:
  instances: 1
  imageName: ${PG_IMAGE}
  enableSuperuserAccess: false
  storage:
    storageClass: bravo-db
    size: 10Gi
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "10"
      max_wal_senders: "10"
      max_slot_wal_keep_size: "2GB"
      password_encryption: scram-sha-256
      pgaudit.log: "ddl, role"
      pgaudit.log_catalog: "off"
      log_connections: "on"
      log_disconnections: "on"
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
  certificates:
    serverAltDNSNames:
      - gke-db.bravo-link.svc
      - gke-db.bravo-link.svc.cluster.local
      - chat-pgbouncer.chat.svc
      - chat-pgbouncer.chat.svc.cluster.local
  projectedVolumeTemplate:
    sources:
      - configMap:
          name: bravo-db-ca
          optional: true
          items: [{key: ca.crt, path: db-ca/ca.crt}]
  bootstrap:
    initdb:
      database: chat
      owner: chat_dbo
      secret:
        name: chat-db-owner
  # DR-01 backup (gate DR-ARCHIVE, DR-RESTORE): WAL archive + base backups by barman-cloud to the GCS bucket
  # db_backup_bucket (infra/envs/target-gcp/db_backup.tf, CMEK). No key: Workload Identity gives the KSA
  # chat/chat-db (made by CNPG) its bucket roles directly. Egress: NetworkPolicy chat-db-backup (60-*.yaml).
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: gs://${DB_BACKUP_BUCKET}/
      googleCredentials:
        gkeEnvironment: true
      wal: {compression: gzip}
      data: {compression: gzip}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
