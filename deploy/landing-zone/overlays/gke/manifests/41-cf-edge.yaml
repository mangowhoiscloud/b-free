# Cloudflare connector (CLOUD-E2E-CONTRACT §3): ns cf-edge, Deployment cloudflared (digest pinned),
# Secret cf-tunnel key token (ESO from OpenBao secret/envs/target-gcp/cf-tunnel). Remote-managed tunnel
# bravo-b-free-chat-gke: ingress b-free-chat-gke.<zone> -> http://bravo-gateway.bravo-edge.svc.cluster.local:80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cf-edge
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: bravo-landing-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: bravo-landing-zone
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: ${CLOUDFLARED_IMAGE}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cf-tunnel, key: token}
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
