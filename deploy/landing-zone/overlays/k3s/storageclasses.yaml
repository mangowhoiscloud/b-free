# StorageClasses with the landing-zone names (D-21, D-23). On K3s the backing is the K3s
# local-path provisioner for now (D-22: on-prem block storage not decided; Rook-Ceph RBD is the
# candidate). The names stay when the backing changes; only this overlay file changes.
# local-path: node-local hostPath volumes, no replication, no expansion, WaitForFirstConsumer.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bravo-db
  annotations:
    bravo.dev/backing: "rancher.io/local-path (temporary, D-22)"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bravo-general
  annotations:
    bravo.dev/backing: "rancher.io/local-path (temporary, D-22)"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false
