# Cilium 1.20.4 on EKS source-aws in AWS VPC CNI chaining mode (TECH-STACK-SPEC: Cilium + Hubble everywhere).
# VPC CNI keeps ENI IPAM and routing; Cilium attaches eBPF to the same veth for policy, service LB and Hubble.
# The vpc-cni add-on runs with enableNetworkPolicy=false (infra/modules/cluster/eks/addons.tf) so there is
# one policy engine. Source: Cilium docs "AWS VPC CNI plugin" (v1.20.4 tree, read 2026-11-02).
#   install.sh <ctx> cilium   (k8sServiceHost is passed from the cluster endpoint, not kept here)
cni:
  chainingMode: aws-cni
  exclusive: false
routingMode: native
# Masquerade ONLY traffic sourced from the node's Cilium cluster-pool range (cilium_host, the Gateway Envoy's "ingress"
# IP, cilium-health) when it leaves for a non-cluster-pool address. Pods keep their VPC IPs (aws-cni), so they are
# never masqueraded: the rule is "-s <node allocCIDR> ! -d <ipv4NativeRoutingCIDR> ! -o cilium_+ -j MASQUERADE".
# Why (measured 2026-11-03 04:2x KST, two app nodes): the Gateway Envoy opens upstream connections from the ingress
# IP (10.0.1.134 on ip-10-10-11-11, ss state syn-sent), which is not a VPC address. To a backend on the same node the
# BPF datapath delivers it; to the other node the SYN never arrives (AWS source/dest check, no VPC route for
# 10.0.x.0/24): envoy cx_connect_fail 3171 of 3517 to the remote pod, 0 to the local one, about 3 % 503 "upstream
# connect error ... connection timeout" at the edge. A temporary MASQUERADE for 10.0.1.0/24 -> 10.10.0.0/16 on that
# node gave 0 connect failures in 12 new connections and 1500/1500 200. The Cilium docs' chaining example uses
# enableIPv4Masquerade=false for pod traffic; this keeps that for pods and fixes only the proxy's own source.
# ipv4NativeRoutingCIDR is the cluster-pool part actually allocated per node (10.0.<n>.0/24 from 10.0.0.0/8, mask
# /24): 10.0.0.0/16 holds 256 nodes. bpf.masquerade stays false (iptables rule above, chaining has no BPF masq path).
enableIPv4Masquerade: true
ipv4NativeRoutingCIDR: 10.0.0.0/16
bpf:
  masquerade: false

# Gateway API needs the eBPF kube-proxy replacement: with "false" cilium-operator logs
# "Gateway API support requires kube-proxy-replacement enabled" and never accepts the GatewayClass
# (checked on this cluster 2026-11-02). The EKS kube-proxy add-on stays installed; Cilium serves Services
# first (socket LB, BPF), so kube-proxy rules only matter for pods Cilium does not manage.
# k8sServiceHost: the EKS API endpoint (public for the operator /32 + private), so the agent never needs
# a Service VIP to reach the API server.
kubeProxyReplacement: "true"
k8sServicePort: 443

# Gateway API (Envoy). Gateways use the parameterised class bravo-cilium (gateway.yaml, Service type NodePort): no LoadBalancer
# Service, so EKS never creates an ELB. CRDs: Gateway API v1.6.3 standard (Cilium 1.20 docs conf.py).
gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"

# Single app node (small preset): one operator replica, otherwise the second stays Pending (anti-affinity).
operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
  # Flow and drop counters per namespace pair (headless Service kube-system/hubble-metrics, port 9965), scraped by
  # otel-agent and sent to the platform over t1-plat-otel (15-r2-contracts 7). Same list on every overlay.
  metrics:
    enabled:
      - "flow:sourceContext=namespace;destinationContext=namespace"
      - "drop:sourceContext=namespace;destinationContext=namespace"
      - "tcp:sourceContext=namespace;destinationContext=namespace"
