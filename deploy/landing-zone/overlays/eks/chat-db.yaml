# CNPG Cluster chat-db on the EKS source (CLOUD-E2E-CONTRACT §3, §9; spec r2 T6).
# PostgreSQL 16, wal_level=logical, max_replication_slots >= 10, max_slot_wal_keep_size set,
# Service chat-db-rw:5432. Data and WAL on separate bravo-db volumes (09-cni-csi.md "CNPG WAL").
# The customer's app credential is generated by CNPG: initdb owner app_writer -> Secret chat-db-app.
# install.sh (step schema) pipes it into Secrets Manager <name>/chat/db-app (the app reads it with the
# SDK, spec §8.10) and the platform OpenBao, hands the database to postgres and recreates app_writer
# with the same password through apps/demo/schema/sql/02_roles.sql, so the final roles equal every
# other environment. pgaudit (T6): DDL and role changes go to the PostgreSQL log.
# Gate DB-AUDIT: pgaudit ddl + role, log_connections and log_disconnections on (logins and logouts in the log).
# Gate DB-TLS (ENC-01): pg_hba takes TLS only (hostnossl ... reject, before CNPG's default "host all all all").
# Every client verifies the CA and the name (sslmode=verify-full, CA bundle ConfigMap chat/bravo-db-ca from
# scripts/db-ca.sh). serverAltDNSNames adds the names clients use besides CNPG's own chat-db-rw.* names:
#   src-db-link.chat.svc[.cluster.local]  on-prem and GKE PgBouncer target-src.ini, on-prem subscription (D-16 links)
#   src-db.bravo-link.svc[.cluster.local] / src-pgb.bravo-link.svc[.cluster.local]  platform Executor (D-16 links)
#   chat-pgbouncer.chat.svc[.cluster.local]  the app -> PgBouncer (PgBouncer serves this certificate, base/chat-pgbouncer.yaml)
# projectedVolumeTemplate: the CA bundle at /projected/db-ca/ca.crt for the reverse subscription bravo_rev_sub
# (sslrootcert). optional: the instance starts before scripts/db-ca.sh has run (fresh install).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chat-db
  namespace: chat
  labels:
    app.kubernetes.io/part-of: bravo-landing-zone
spec:
  instances: 1
  imageName: ${PG_IMAGE}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: chat
      owner: app_writer
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "10"
      max_wal_senders: "10"
      max_slot_wal_keep_size: "4GB"
      password_encryption: scram-sha-256
      pgaudit.log: "ddl, role"
      pgaudit.log_catalog: "off"
      log_connections: "on"
      log_disconnections: "on"
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
  certificates:
    serverAltDNSNames:
      - src-db-link.chat.svc
      - src-db-link.chat.svc.cluster.local
      - src-db.bravo-link.svc
      - src-db.bravo-link.svc.cluster.local
      - src-pgb.bravo-link.svc
      - src-pgb.bravo-link.svc.cluster.local
      - chat-pgbouncer.chat.svc
      - chat-pgbouncer.chat.svc.cluster.local
  projectedVolumeTemplate:
    sources:
      - configMap:
          name: bravo-db-ca
          optional: true
          items: [{key: ca.crt, path: db-ca/ca.crt}]
  storage:
    storageClass: bravo-db
    size: 10Gi
  walStorage:
    storageClass: bravo-db
    size: 10Gi
  # DR-01 backup (gate DR-ARCHIVE, DR-RESTORE): WAL archive + base backups by barman-cloud to the S3 bucket
  # db_backup_bucket (infra/envs/source-aws/db_backup.tf, SSE-KMS, TLS only). No key: EKS Pod Identity gives the
  # CNPG service account chat/chat-db its role (inheritFromIAMRole uses the injected container credentials).
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://${DB_BACKUP_BUCKET}/
      s3Credentials:
        inheritFromIAMRole: true
      wal: {compression: gzip}
      data: {compression: gzip}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
