# Demo app on the on-prem RKE2 landing zone. Helm layers, last wins:
#   apps/demo/chart/ci/k3s-values.yaml          on-prem values: network policy, OTel, admin token
#   apps/demo/chart/values-onprem.generated.yaml image, environment, publicUrl, DB, S3 (render-values.sh)
#   this file                                    air-gapped image policy, egress for this layout, RGW CA
image:
  pullPolicy: Never          # imported into containerd from `docker save`; never pulled
networkPolicy:
  enabled: true
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cf-edge}}}]
      ports: [{port: 8000, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: chat-pgbouncer}}}]
      ports: [{port: 6432, protocol: TCP}]
    # RGW over TLS only (S3_ENDPOINT_URL https://rook-ceph-rgw-bravo.rook-ceph.svc, pod port 443). The plain listener
    # (Service 80 -> pod 8080) is not reachable from the app: gate OBJ-PLAIN-EGRESS (ENC-01), 2026-11-03.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: rook-ceph}}}]
      ports: [{port: 443, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: bravo-observability}}}]
      ports: [{port: 4317, protocol: TCP}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
# RGW serves TLS with the landing zone's private CA (ConfigMap bravo-rgw-ca); botocore reads
# AWS_CA_BUNDLE. The TLS-only bucket policy denies plain HTTP, so this is required.
# DB CA bundle (ConfigMap bravo-db-ca, scripts/db-ca.sh): the DSN in Secret bravo-demo-db (install.sh step secrets)
# has sslmode=verify-full sslrootcert=/var/run/bravo/db-ca/ca.crt; PgBouncer serves the chat-db certificate.
extraEnv:
  - {name: AWS_CA_BUNDLE, value: /var/run/bravo/rgw-ca/ca.crt}
extraVolumes:
  - name: rgw-ca
    configMap: {name: bravo-rgw-ca}
  - name: db-ca
    configMap: {name: bravo-db-ca, items: [{key: ca.crt, path: ca.crt}]}
extraVolumeMounts:
  - {name: rgw-ca, mountPath: /var/run/bravo/rgw-ca, readOnly: true}
  - {name: db-ca, mountPath: /var/run/bravo/db-ca, readOnly: true}
