# RGW user for the rehearsal verification Job (B7, platform/rehearsal/src/bravo_rehearsal/behavioral.py).
# It owns one bucket, bravo-rehearsal-verify, where the Job applies a proposed bucket policy and checks that an
# unsigned GET is refused and a signed GET works. Its keys are generated by RGW in-cluster (Secret
# rook-ceph-object-user-bravo-bravo-rehearsal-verify) and piped to the platform OpenBao
# secret/envs/<env>/rehearsal-s3 by scripts/rgw-rehearsal-bucket.sh. The platform reads them from there per Trial
# (D-26). No grant on any other bucket.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: bravo-rehearsal-verify
  namespace: rook-ceph
spec:
  store: bravo
  displayName: bravo rehearsal verification Job (owner of bravo-rehearsal-verify only)
  quotas:
    maxBuckets: 1
    maxObjects: 100
    maxSize: 64Mi
---
# The "other credential" of the gate's OBJ-05, for the same Job (B11/P14: the Job asks the gate's OBJ-01..06). It owns
# nothing and is granted nothing: a proposed policy must refuse its GET of the canary with AccessDenied. Keys go to the
# same OpenBao record (other_access_key_id, other_secret_access_key) through scripts/rgw-rehearsal-bucket.sh.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: bravo-rehearsal-other
  namespace: rook-ceph
spec:
  store: bravo
  displayName: bravo rehearsal verification Job, other credential (no bucket, no grant)
  quotas:
    maxBuckets: 1
    maxObjects: 1
    maxSize: 1Mi
