# RGW object store "bravo" (D-22): S3 API on 80 (plain) and 443 (TLS, Secret rgw-bravo-tls made by
# install.sh). The bucket policy denies requests without TLS (aws:SecureTransport, BoolIfExists),
# so port 80 answers only with AccessDenied; OBJ-06 checks exactly that.
# SSE-KMS (OBJ-ENC, D-26): security.kms points RGW at the PLATFORM OpenBao transit engine through the D-16 link
# Service rook-ceph/openbao (rgw-kms-link.yaml; the OpenBao certificate names "openbao", verify on). RGW asks
# transit/datakey/plaintext/<key> for each object's data key and keeps only the wrapped copy; GET calls
# transit/decrypt/<key>. The key (rgw-target-onprem, keys.sh rgw-kms-init) never leaves OpenBao. The attachments
# bucket's default encryption is aws:kms with that key id (deploy/cloud/rgw_encryption.py --apply).
# Before the first apply with security.kms: deploy/platform/scripts/onprem-tokens.sh rgw-kms (Rook refuses the
# store without Secrets rgw-kms-token and rgw-kms-ca). The token lives 1h, CronJob rgw-kms-renew renews it, and RGW
# copies it at pod start: a new token (before 168h) means an RGW restart (onprem-tokens.sh rgw-kms does that).
# Dependency: every PUT/GET of an SSE-KMS object needs that link and the platform OpenBao; without them RGW
# answers an error (measured: docs/evidence/gate/obj-enc-onprem-*/README.md). Objects stored before stay plain.
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: bravo
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: host
    replicated: {size: 2, requireSafeReplicaSize: false}
  dataPool:
    failureDomain: host
    replicated: {size: 2, requireSafeReplicaSize: false}
  preservePoolsOnDelete: false
  gateway:
    port: 80
    securePort: 443
    sslCertificateRef: rgw-bravo-tls
    instances: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  security:
    kms:
      connectionDetails:
        KMS_PROVIDER: vault
        VAULT_ADDR: https://openbao:8200        # rook-ceph/openbao = link client -> t1-plat-bao -> platform OpenBao
        VAULT_SECRET_ENGINE: transit            # Rook: rgw crypt vault prefix /v1/transit (mount transit/)
        VAULT_CACERT: rgw-kms-ca                # Secret key "cert": platform OpenBao CA (public)
      tokenSecretName: rgw-kms-token            # Secret key "token": AppRole rgw-kms-target-onprem token
---
# Bucket provisioning through ObjectBucketClaim: the bucket owner's keys are generated by RGW
# in-cluster (Secret <claim name> in the claim's namespace). Nothing goes through Terraform.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bravo-bucket
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Delete
parameters:
  objectStoreName: bravo
  objectStoreNamespace: rook-ceph
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: bravo-demo-attachments
  namespace: chat
spec:
  bucketName: bravo-demo-attachments
  storageClassName: bravo-bucket
---
# A second RGW user with no grant on the bucket: the "other credential" of OBJ-05.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: bravo-gate-other
  namespace: rook-ceph
spec:
  store: bravo
  displayName: bravo gate OBJ-05 probe (no bucket grant)
