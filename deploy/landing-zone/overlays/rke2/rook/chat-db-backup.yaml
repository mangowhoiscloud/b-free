# RGW user for the CNPG chat-db backup (DR-01, gate DR-RESTORE / DR-ARCHIVE). It owns one bucket,
# bravo-chat-db-backup (WAL + base backups by barman-cloud), separate from the attachments bucket.
# Its keys are NOT generated by RGW: scripts/rgw-backup-bucket.sh generates them in the platform OpenBao
# (secret/envs/<env>/chat-db-backup, D-26) and pipes them into Secret rook-ceph/chat-db-backup-keys, which this
# user reads (spec.keys), and into Secret chat/chat-db-backup-s3, which the Cluster chat-db reads.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: chat-db-backup
  namespace: rook-ceph
spec:
  store: bravo
  displayName: CNPG chat-db backup (owner of bravo-chat-db-backup only)
  keys:
    - accessKeyRef: {name: chat-db-backup-keys, key: access-key}
      secretKeyRef: {name: chat-db-backup-keys, key: secret-key}
  quotas:
    maxBuckets: 1
    maxSize: 20Gi
