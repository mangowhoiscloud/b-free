# STOPGAP only (BRAVO_BLOCK_BACKING=local-path): bravo-db / bravo-general on the local-path
# provisioner (local-path.yaml). The default is Rook-Ceph RBD with the rbd-nbd mounter
# (storageclasses-rbd.yaml); use this file only if RBD cannot serve CNPG. The names stay
# when the backing changes; StorageClass parameters are immutable, so switching recreates them.
# local-path: node-local hostPath volumes, no replication, no expansion, WaitForFirstConsumer.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bravo-db
  annotations:
    bravo.dev/backing: "rancher.io/local-path (STOPGAP)"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bravo-general
  annotations:
    bravo.dev/backing: "rancher.io/local-path (STOPGAP)"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false
