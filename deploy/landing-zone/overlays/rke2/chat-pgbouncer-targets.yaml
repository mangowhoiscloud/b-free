# PgBouncer targets on the on-prem destination (RKE2 on Lima) (CLOUD-E2E-CONTRACT §9). Each file holds only the
# [databases] section; the Executor copies one of them to /run/pgbouncer/active.ini.
#   target-src.ini: the source DB through the D-16 env link Service src-db-link
#                   (deploy/cloud/env-link, cloudflared access tcp, token dst-src-db).
#   target-dst.ini: the local CNPG chat-db.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-pgbouncer-targets
  namespace: chat
  annotations:
    bravo.dev/link: "D-16 환경 간 링크(cloudflared access tcp, 토큰 dst-src-db)"
data:
  target-src.ini: |
    [databases]
    chat = host=src-db-link.chat.svc.cluster.local port=5432 dbname=chat
  target-dst.ini: |
    [databases]
    chat = host=chat-db-rw.chat.svc.cluster.local port=5432 dbname=chat
