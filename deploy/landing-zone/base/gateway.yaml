# In-environment entry (CLOUD-E2E-CONTRACT §3): Gateway bravo-gateway in ns bravo-edge. With the
# Cilium implementation the data-plane Service is cilium-gateway-bravo-gateway; the tunnel's
# origin_service points at it. Only ns chat may attach routes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bravo-gateway
  namespace: bravo-edge
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: chat}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: chat
spec:
  parentRefs:
    - {name: bravo-gateway, namespace: bravo-edge, sectionName: http}
  # Environment name and the front name (CNAME to the active environment's tunnel).
  hostnames: [b-free-chat-dst.mangowhois.ai, b-free-chat.mangowhois.ai]
  rules:
    # Plain HTTP at the edge -> 301 to https (D-29 finding, 2026-11-03). cloudflared reaches this Gateway over plain
    # HTTP, so X-Forwarded-Proto is always "http" here (measured: the Gateway sets it from its own downstream); the
    # visitor's scheme arrives only in Cloudflare's CF-Visitor header. https requests (CF-Visitor https) and callers
    # without the header (in-cluster, health checks) keep the plain rule below. More header matches win on the same path.
    - matches:
        - path: {type: PathPrefix, value: /}
          headers: [{type: Exact, name: CF-Visitor, value: '{"scheme":"http"}'}]
      filters:
        - {type: RequestRedirect, requestRedirect: {scheme: https, statusCode: 301}}
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs:
        - {name: chat-bravo-demo, port: 80}
