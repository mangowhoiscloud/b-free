# Landing zone namespaces (D-23). Pod Security "restricted" everywhere except where an overlay
# says otherwise (rook-ceph on K3s).
apiVersion: v1
kind: Namespace
metadata:
  name: chat
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    bravo.dev/landing-zone: "true"
---
