# CNPG Cluster chat-db (CLOUD-E2E-CONTRACT §3, §9): PostgreSQL 16, logical decoding for the
# cutover engine. CNPG generates the owner (chat-db-app) and superuser (chat-db-superuser) Secrets.
# Roles app_writer/replicator/executor_* come from apps/demo/schema/sql with passwords from the
# platform OpenBao (secret/envs/<env>/chat-db), applied by the data path, not by this manifest.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chat-db
  namespace: chat
spec:
  instances: 1
  imageName: ${PG_IMAGE}
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: chat
      owner: app
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "10"
      max_wal_senders: "10"
      max_slot_wal_keep_size: 2GB
      password_encryption: scram-sha-256
  storage:
    storageClass: bravo-db
    size: 5Gi
  # DR-01 backup (gate DR-ARCHIVE, DR-RESTORE): WAL archive + base backups by barman-cloud to the on-prem RGW
  # bucket bravo-chat-db-backup (owner chat-db-backup, scripts/rgw-backup-bucket.sh; keys from the platform
  # OpenBao, D-26). Only the rke2 overlay uses this file; eks and gke have their own chat-db with S3 / GCS.
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://bravo-chat-db-backup/
      endpointURL: https://rook-ceph-rgw-bravo.rook-ceph.svc:443
      endpointCA: {name: chat-db-backup-ca, key: ca.crt}
      s3Credentials:
        accessKeyId: {name: chat-db-backup-s3, key: ACCESS_KEY_ID}
        secretAccessKey: {name: chat-db-backup-s3, key: ACCESS_SECRET_KEY}
      wal: {compression: gzip}
      data: {compression: gzip}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
