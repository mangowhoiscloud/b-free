# PgBouncer chat-pgbouncer (CLOUD-E2E-CONTRACT §9). The Executor switches the target with
# pods/exec: cp /etc/pgbouncer/targets/target-<side>.ini /run/pgbouncer/active.ini, then RELOAD.
# Targets come from the overlay ConfigMap chat-pgbouncer-targets (directory mount, no subPath).
# Durable target (2026-11-03): the Executor also patches ConfigMap chat-pgbouncer-target (key target = src | dst)
# in the same step, and the init container copies the file that ConfigMap names. A PgBouncer restart after a
# cutover therefore keeps the switched target. The ConfigMap is NOT in this kustomization: install creates it once
# (target=src) only when it is missing, so re-applying the base never resets a switched target.
# Pool (2026-11-03): before the cutover the destination's PgBouncer reaches the source primary over the D-16 link,
# one round trip about 340 ms. 10 server connections carried about 16 writes/s (load lane); 30 carry the SHIFT
# 50 % share of a 50 writes/s load with room. Opening one server connection over the link (TCP, TLS verify-full,
# SCRAM) costs several round trips, and a SHIFT 10 % step that had to open 3 of them failed its p95 (04:46 KST).
# Warm pool: during a SHIFT round trip the destination used at most 16 server connections at once (SHOW POOLS every
# 0.25 s, 04:54 KST; 16 = the two app replicas' DB_POOL_MAX 8 each). min_pool_size 20 keeps that many open with room.
# server_idle_timeout 0 never closes an idle one; server_lifetime 86400 keeps each for a day (0 would mean "use once").
# Passwords: Secret chat-pgbouncer-auth (keys app_writer, pgb_admin, pgb_stats), created by the
# platform from OpenBao secret/envs/<env>/chat-db through a pipe.
# TLS (ENC-01, 02-network.md 11.2):
#   server side  verify-full against ConfigMap bravo-db-ca (scripts/db-ca.sh, the CNPG CAs of every environment),
#                because the target moves from the local chat-db to the other environment's chat-db over the D-16
#                link at cutover. The name checked is the host= of the active target (chat-db-rw.chat.svc.cluster.local,
#                src-db-link / dst-db-link.chat.svc.cluster.local); each is in that chat-db's serverAltDNSNames.
#   client side  TLS required. PgBouncer serves the local chat-db server certificate (Secret chat-db-server, made
#                and renewed by CNPG; its SANs include chat-pgbouncer.chat.svc[.cluster.local] and the platform link
#                name *-pgb.bravo-link.svc.cluster.local), so the app and the Executor verify it with the CNPG CA.
#                CNPG renews the certificate 7 days before it expires; RELOAD (or a restart) picks up the new file.
# The pod waits (volume mount) until both chat-db-server and bravo-db-ca exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-pgbouncer-config
  namespace: chat
data:
  pgbouncer.ini: |
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir =
    auth_type = scram-sha-256
    auth_file = /run/pgbouncer-auth/userlist.txt
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 30
    min_pool_size = 20
    server_idle_timeout = 0
    server_lifetime = 86400
    reserve_pool_size = 0
    max_prepared_statements = 0
    admin_users = pgb_admin
    stats_users = pgb_stats
    query_wait_timeout = 8
    server_connect_timeout = 5
    server_login_retry = 1
    ignore_startup_parameters = extra_float_digits,options
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    server_tls_sslmode = verify-full
    server_tls_ca_file = /etc/pgbouncer/db-ca/ca.crt
    client_tls_sslmode = require
    client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
    client_tls_key_file = /etc/pgbouncer/tls/tls.key
    %include /run/pgbouncer/active.ini
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-pgbouncer
  namespace: chat
  labels: {app.kubernetes.io/name: chat-pgbouncer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: chat-pgbouncer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: chat-pgbouncer}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10070
        runAsGroup: 10070
        fsGroup: 10070
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Target selection: the side ConfigMap chat-pgbouncer-target names (the Executor patches it when it
        # switches), target-src.ini when the ConfigMap is missing (source DB; on the destination that is the link).
        # userlist.txt is rendered from the Secret keys into a memory volume (mode 600).
        - name: select-default
          image: ${PGBOUNCER_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command:
            - sh
            - -c
            - |
              set -eu
              side="$(cat /etc/pgbouncer/target-select/target 2>/dev/null || echo src)"
              case "$side" in src|dst) ;; *) echo "chat-pgbouncer-target names '$side', not src or dst" >&2; exit 1 ;; esac
              cp "/etc/pgbouncer/targets/target-$side.ini" /run/pgbouncer/active.ini
              umask 077
              for u in app_writer pgb_admin pgb_stats; do
                pw="$(cat "/var/run/bravo/pgbouncer/$u")"
                case "$pw" in *'"'*) echo "password for $u contains a quote" >&2; exit 1 ;; esac
                printf '"%s" "%s"\n' "$u" "$pw"
              done > /run/pgbouncer-auth/userlist.txt
              echo "selected target-$side.ini; userlist rendered (3 users)"
          securityContext: &csc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: targets, mountPath: /etc/pgbouncer/targets, readOnly: true}
            - {name: target-select, mountPath: /etc/pgbouncer/target-select, readOnly: true}
            - {name: active, mountPath: /run/pgbouncer}
            - {name: auth, mountPath: /run/pgbouncer-auth}
            - {name: auth-src, mountPath: /var/run/bravo/pgbouncer, readOnly: true}
      containers:
        - name: pgbouncer
          image: ${PGBOUNCER_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          env:
            - {name: PGBOUNCER_INI, value: /etc/pgbouncer/main/pgbouncer.ini}
          ports:
            - {name: pgbouncer, containerPort: 6432}
          readinessProbe:
            tcpSocket: {port: pgbouncer}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: pgbouncer}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: *csc
          volumeMounts:
            - {name: main, mountPath: /etc/pgbouncer/main, readOnly: true}
            - {name: targets, mountPath: /etc/pgbouncer/targets, readOnly: true}
            - {name: active, mountPath: /run/pgbouncer}
            - {name: auth, mountPath: /run/pgbouncer-auth, readOnly: true}
            - {name: db-ca, mountPath: /etc/pgbouncer/db-ca, readOnly: true}
            - {name: tls, mountPath: /etc/pgbouncer/tls, readOnly: true}
      volumes:
        - name: main
          configMap: {name: chat-pgbouncer-config}
        - name: target-select
          configMap: {name: chat-pgbouncer-target, optional: true}
        - name: db-ca
          configMap: {name: bravo-db-ca, items: [{key: ca.crt, path: ca.crt}]}
        - name: tls
          secret: {secretName: chat-db-server, defaultMode: 0440}
        - name: targets
          configMap: {name: chat-pgbouncer-targets}
        - name: active
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: auth
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: auth-src
          secret: {secretName: chat-pgbouncer-auth, defaultMode: 0400}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-pgbouncer
  namespace: chat
spec:
  selector: {app.kubernetes.io/name: chat-pgbouncer}
  ports:
    - {name: pgbouncer, port: 6432, targetPort: pgbouncer}
---
# Executor (laptop, platform side) needs only these in ns chat (CLOUD-E2E-CONTRACT §9).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-executor
  namespace: chat
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bravo-executor
  namespace: chat
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-executor
  namespace: chat
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-executor}
subjects:
  - {kind: ServiceAccount, name: bravo-executor, namespace: chat}
