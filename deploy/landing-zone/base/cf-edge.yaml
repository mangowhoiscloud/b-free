# Cloudflare connector (CLOUD-E2E-CONTRACT §3, §6): Deployment cloudflared in ns cf-edge, image
# pinned by digest, token from Secret cf-tunnel (key token) that the platform creates from
# OpenBao secret/envs/<env>/cf-tunnel. Ingress rules are the tunnel's remote config (infra/envs/edge).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cf-edge
  labels: {app.kubernetes.io/name: cloudflared}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: ${CLOUDFLARED_IMAGE}
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cf-tunnel, key: token}
          ports:
            - {name: metrics, containerPort: 2000}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
