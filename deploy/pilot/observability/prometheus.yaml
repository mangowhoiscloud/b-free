global: { scrape_interval: 15s }
otlp:
  promote_resource_attributes: [service.name, service.namespace, deployment.environment.name, bravo.plan_id]
storage:
  tsdb: { out_of_order_time_window: 30m }
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
