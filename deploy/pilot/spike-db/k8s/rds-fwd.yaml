# Temporary link, forward leg (임시 링크(D-16 전), CLOUD-E2E-CONTRACT.md 7): the laptop reaches RDS
# with `kubectl port-forward deploy/rds-fwd`. RDS is private, so a pod in the same VPC splices TCP.
# TLS stays end to end (the client verifies the RDS name), the pod sees only ciphertext.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-fwd
  namespace: spike-db
data:
  fwd.py: |
    import asyncio, os, sys
    UP_HOST = os.environ["UPSTREAM_HOST"]; UP_PORT = int(os.environ.get("UPSTREAM_PORT", "5432"))
    async def pipe(r, w):
        try:
            while (d := await r.read(65536)):
                w.write(d); await w.drain()
        finally:
            try: w.close()
            except Exception: pass
    async def handle(cr, cw):
        try:
            ur, uw = await asyncio.wait_for(asyncio.open_connection(UP_HOST, UP_PORT), 10)
        except Exception as e:
            print(f"upstream connect failed: {e!r}", file=sys.stderr, flush=True); cw.close(); return
        await asyncio.gather(pipe(cr, uw), pipe(ur, cw), return_exceptions=True)
    async def main():
        srv = await asyncio.start_server(handle, "127.0.0.1", 5432)
        print(f"rds-fwd listening 127.0.0.1:5432 -> {UP_HOST}:{UP_PORT}", flush=True)
        async with srv: await srv.serve_forever()
    asyncio.run(main())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-fwd
  namespace: spike-db
  labels: {app.kubernetes.io/name: rds-fwd, app.kubernetes.io/part-of: bravo-spike-db}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rds-fwd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rds-fwd, app.kubernetes.io/part-of: bravo-spike-db}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fwd
          image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
          command: ["python3", "/opt/fwd/fwd.py"]
          env:
            - {name: UPSTREAM_HOST, value: "RDS_ENDPOINT"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: fwd, mountPath: /opt/fwd, readOnly: true}]
      volumes: [{name: fwd, configMap: {name: rds-fwd}}]
