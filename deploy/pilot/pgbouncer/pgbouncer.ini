;; PgBouncer for the pilot write path (CONTRACT.md 4).
;; This file seeds the shared volume `pgbouncer-config` once. After that, only the
;; Executor rewrites [databases] (cutover step 7) and sends RELOAD. Re-running
;; `compose up` does not reset the target: render-config.sh copies this file only
;; when the volume has none.

[databases]
chat = host=src-db port=5432 dbname=chat

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
reserve_pool_size = 0
max_prepared_statements = 0

admin_users = pgb_admin
stats_users = pgb_stats

;; Clients wait in the queue while the pool is paused (cutover steps 3-7).
query_wait_timeout = 120
server_connect_timeout = 5
server_login_retry = 1
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
