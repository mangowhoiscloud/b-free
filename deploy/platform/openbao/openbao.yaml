# Platform OpenBao on EKS (D-26). One raft node (StatefulSet replica 1), Shamir seal kept on purpose:
# the shares stay in operator custody, so a restarted pod comes back SEALED and is not Ready until
# `keys.sh --target platform-eks unseal` (readiness = unsealed, the same signal as the pilot healthcheck).
# TLS: Secret openbao-tls (tls.crt, tls.key, ca.crt) made by `keys.sh --target platform-eks tls`; not in Git.
# Clients inside the cluster use https://openbao.openbao.svc:8200 with the CA from ConfigMap openbao-ca.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: bravo-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: https
      port: 8200
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-internal
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: https
      port: 8200
      targetPort: https
    - name: cluster
      port: 8201
      targetPort: cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: bravo-platform
    app.kubernetes.io/component: key-store
spec:
  serviceName: openbao-internal
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/part-of: bravo-platform
    spec:
      serviceAccountName: openbao
      automountServiceAccountToken: false
      nodeSelector:
        bravo.io/pool: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: openbao
          image: openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f # 2.7.2
          command: ["bao", "server", "-config=/openbao/config/bao.hcl"]
          env:
            - name: BAO_ADDR
              value: https://127.0.0.1:8200
            - name: BAO_CACERT
              value: /openbao/tls/ca.crt
          ports:
            - name: https
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          readinessProbe:
            # 200 only when initialised, unsealed and active.
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health
              port: https
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # The process answers; sealed (503) and uninitialised (501) still count as alive.
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?sealedcode=200&uninitcode=200&standbyok=true
              port: https
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: tls
              mountPath: /openbao/tls
              readOnly: true
            - name: data
              mountPath: /openbao/file
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: tls
          secret:
            secretName: openbao-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: bravo-db
        resources:
          requests:
            storage: 2Gi
---
# Only the platform services that read secrets (and the operator's port-forward, which bypasses
# NetworkPolicy through the kubelet) reach OpenBao. No egress except DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bravo-control
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["executor", "rehearsal", "api"]
      ports:
        - port: https
    # D-16 link t1-plat-bao: the platform tunnel connector carries GKE External Secrets (Access service token).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cf-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: https
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Kubernetes auth (keys.sh k8s-auth-setup): OpenBao calls TokenReview on the API server with the client's own
# service-account JWT. Cilium gives the API server the reserved identity kube-apiserver, which a Kubernetes
# NetworkPolicy cannot select, so this one egress rule is a CiliumNetworkPolicy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-tokenreview
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  egress:
    - toEntities: ["kube-apiserver"]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}, {port: "443", protocol: TCP}]
