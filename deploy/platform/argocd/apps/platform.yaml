# Argo CD Applications for the platform RKE2 node (spec §7.2). Repo over SSH with a read-only deploy key
# (Secret argocd/repo-b-free from OpenBao secret/envs/platform/argocd-repo).
# Sync is MANUAL for now: origin/main lags the digests deployed from the working tree between checkpoint pushes,
# and an automated sync would roll live images back. Turn on `automated` (prune: false) once main holds the
# deployed digests (each app should show Synced before that). (app-of-apps root: ../root.yaml).
# Git: https://github.com/mangowhoiscloud/b-free.git main. Out-of-Git objects (Secrets piped from OpenBao) are never pruned: prune is off.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: git@github.com:mangowhoiscloud/b-free.git
    targetRevision: main
    path: deploy/platform/gateway-api
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles: [$values/deploy/landing-zone/overlays/rke2/cilium-values.yaml]
    - repoURL: git@github.com:mangowhoiscloud/b-free.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
