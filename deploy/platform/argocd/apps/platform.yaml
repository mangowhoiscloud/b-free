apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: bravo-control
  source:
    repoURL: git@github.com:mangowhoiscloud/b-free.git
    targetRevision: main
    path: deploy/platform/control
  # Manual (2026-11-02 22:3x): live collector 9f675c2d (collector lane, masking fix) is newer than main (0893095f);
  # an automated sync would roll it back. Re-enable once main pins the live collector digest.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
