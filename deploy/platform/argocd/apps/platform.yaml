# Argo CD Applications for the platform RKE2 node (spec §7.2). Repo over SSH with a read-only deploy key
# (Secret argocd/repo-b-free from OpenBao secret/envs/platform/argocd-repo).
# Automated sync (prune: false, selfHeal: true) since checkpoint 59173a2 (2026-11-02 22:3x): rendered manifests at that
# commit matched live for every app with no image change. Exceptions stay manual: cilium (render-time certificates)
# and control (live collector newer than main).
# Out-of-Git Secrets (piped from OpenBao) are never pruned. The root app (root.yaml) stays manual until this file is
# on main, so it cannot revert these children. (app-of-apps root: ../root.yaml).
# Git: https://github.com/mangowhoiscloud/b-free.git main. Out-of-Git objects (Secrets piped from OpenBao) are never pruned: prune is off.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: git@github.com:mangowhoiscloud/b-free.git
    targetRevision: main
    path: deploy/platform/gateway-api
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles: [$values/deploy/landing-zone/overlays/rke2/cilium-values.yaml]
    - repoURL: git@github.com:mangowhoiscloud/b-free.git
      targetRevision: main
      ref: values
  # Manual on purpose: the chart generates the Cilium CA and Hubble TLS certificates at render time, so every
  # reconcile differs and an automated sync would roll the agents and rotate certificates each time. Apply chart
  # or value changes (e.g. the landing-zone Hubble metrics at 59173a2) with a deliberate manual sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: git@github.com:mangowhoiscloud/b-free.git
    targetRevision: main
    path: deploy/platform/storage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valuesObject:
          config:
            clusterWide: true
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
