# App-of-apps root for the platform RKE2 node. Applied once by deploy/platform/scripts/bootstrap.sh; from then on
# Argo CD pulls everything under deploy/platform/argocd/apps from Git (D-16, 14-provisioning-scenarios 1.4-1.5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mangowhoiscloud/b-free.git
    targetRevision: main
    path: deploy/platform/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Automated once main holds apps/platform.yaml with control on auto-sync (apply this file after that push;
  # applied earlier, it would sync the older copy and turn control back to manual).
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
