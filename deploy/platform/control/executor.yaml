# Cutover Executor (§8.6, D-19): StatefulSet replica 1, never force-deleted. Outside any mesh.
# Image: the data/cutover lane's cloud build (bravo-platform/executor tag cloud-202611022104) in topology mode:
# - BRAVO_TOPOLOGY_FILE: deploy/cloud/in-cluster/topology.json (no secrets): DB / PgBouncer / write-block entries
#   through the bravo-link Services (D-16 links t1-src-* / t1-dst-*, Access service tokens).
# - BRAVO_SECRETS_DIR: one optional Secret per OpenBao path (bx-<path>), delivered from OpenBao by
#   deploy/platform/scripts/deliver-secrets.sh, mounted as <path with / as __>/<field> (topology.FileSecrets).
# - KUBECONFIG: deploy/cloud/in-cluster/kubeconfig.template.yaml (pods/exec to chat-pgbouncer on both clusters):
#   source EKS token from this pod's web identity role executor-ctl (python -m bravo_executor.ekstoken),
#   on-prem token file from OpenBao secret/envs/target-onprem/k8s-executor. CA files: ConfigMap executor-kube-ca
#   (public cluster CAs, deploy/platform/scripts/cluster-cas.sh).
apiVersion: v1
kind: ServiceAccount
metadata: {name: executor, namespace: bravo-control}
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: executor
  namespace: bravo-control
  labels: {app.kubernetes.io/name: executor, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
spec:
  serviceName: executor
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: executor}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: executor, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
    spec:
      serviceAccountName: executor
      automountServiceAccountToken: false
      nodeSelector: {bravo.io/pool: core}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: executor
          image: bravo/executor
          env:
            - {name: OTEL_SERVICE_NAME, value: executor}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.bravo-observe.svc:4317"}
            - {name: BRAVO_EXECUTOR_HOST, value: 0.0.0.0}
            - {name: BRAVO_EXECUTOR_PORT, value: "8081"}
            - {name: BRAVO_TOPOLOGY_FILE, value: /etc/bravo/topology/topology.json}
            - {name: BRAVO_SECRETS_DIR, value: /etc/bravo/secrets}
            - {name: KUBECONFIG, value: /etc/bravo/kube/config}
            - name: PLATFORM_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: executor}}
            - name: PLATFORM_DB_DSN
              value: postgresql://bravo_executor:$(PLATFORM_DB_PASSWORD)@platform-db-rw.bravo-control.svc:5432/bravo?sslmode=verify-full&sslrootcert=/etc/bravo/pg-ca/ca.crt
            - {name: BRAVO_LOCK_LEASE_S, value: "600"}
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            # Executor 역할(제어): eks:DescribeCluster on bravo-source + EKS access entry group bravo-executor.
            - {name: AWS_ROLE_ARN, value: "arn:aws:iam::721622471953:role/bravo-platform-executor-ctl-c996b0ed62fdaf4d3a2dc3c712"}
            - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/sts.amazonaws.com/serviceaccount/token}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 30m, memory: 192Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: topology, mountPath: /etc/bravo/topology, readOnly: true}
            - {name: kube, mountPath: /etc/bravo/kube, readOnly: true}
            - {name: pg-ca, mountPath: /etc/bravo/pg-ca, readOnly: true}
            - {name: aws-token, mountPath: /var/run/secrets/sts.amazonaws.com/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: s-envs-source-aws-chat-db, mountPath: /etc/bravo/secrets/envs__source-aws__chat-db, readOnly: true}
            - {name: s-envs-target-onprem-chat-db, mountPath: /etc/bravo/secrets/envs__target-onprem__chat-db, readOnly: true}
            - {name: s-envs-source-aws-chat-admin, mountPath: /etc/bravo/secrets/envs__source-aws__chat-admin, readOnly: true}
            - {name: s-envs-target-onprem-chat-admin, mountPath: /etc/bravo/secrets/envs__target-onprem__chat-admin, readOnly: true}
            - {name: s-envs-source-aws-object-store, mountPath: /etc/bravo/secrets/envs__source-aws__object-store, readOnly: true}
            - {name: s-envs-target-onprem-object-store, mountPath: /etc/bravo/secrets/envs__target-onprem__object-store, readOnly: true}
            - {name: s-envs-target-onprem-k8s-executor, mountPath: /etc/bravo/secrets/envs__target-onprem__k8s-executor, readOnly: true}
      volumes:
        - {name: topology, configMap: {name: executor-topology}}
        - name: kube
          projected:
            sources:
              - configMap: {name: executor-kubeconfig, items: [{key: config, path: config}]}
              - configMap: {name: executor-kube-ca, optional: true}
        - {name: pg-ca, secret: {secretName: platform-db-ca, items: [{key: ca.crt, path: ca.crt}]}}
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: token}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: s-envs-source-aws-chat-db, secret: {secretName: bx-envs-source-aws-chat-db, optional: true, defaultMode: 0440}}
        - {name: s-envs-target-onprem-chat-db, secret: {secretName: bx-envs-target-onprem-chat-db, optional: true, defaultMode: 0440}}
        - {name: s-envs-source-aws-chat-admin, secret: {secretName: bx-envs-source-aws-chat-admin, optional: true, defaultMode: 0440}}
        - {name: s-envs-target-onprem-chat-admin, secret: {secretName: bx-envs-target-onprem-chat-admin, optional: true, defaultMode: 0440}}
        - {name: s-envs-source-aws-object-store, secret: {secretName: bx-envs-source-aws-object-store, optional: true, defaultMode: 0440}}
        - {name: s-envs-target-onprem-object-store, secret: {secretName: bx-envs-target-onprem-object-store, optional: true, defaultMode: 0440}}
        - {name: s-envs-target-onprem-k8s-executor, secret: {secretName: bx-envs-target-onprem-k8s-executor, optional: true, defaultMode: 0440}}
---
apiVersion: v1
kind: Service
metadata: {name: executor, namespace: bravo-control, labels: {app.kubernetes.io/name: executor}}
spec:
  selector: {app.kubernetes.io/name: executor}
  ports: [{name: http, port: 8081, targetPort: http}]
