# Collector (FR-1, FR-2), gate (FR-6, FR-12), rehearsal service (S2, Harbor) and Cutover Executor (§8.6).
# AWS access only through service-account web identity (infra/envs/platform-aws rke2.tf: RKE2 issuer published in
# S3, IAM OIDC provider, AssumeRoleWithWebIdentity per service account): no ~/.aws mount, no static key, not the
# node role (NFR-6, D-26). The gate has its own read identity in every environment (scripts/gate-credentials.sh,
# link/gate-rbac/README.md), separate from the collector.
apiVersion: v1
kind: ServiceAccount
metadata: {name: collector, namespace: bravo-control}
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: bravo-control
  labels: {app.kubernetes.io/name: collector, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: collector}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: collector, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
    spec:
      serviceAccountName: collector
      automountServiceAccountToken: false
      nodeSelector: {bravo.io/pool: core}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # Sparse checkout of the customer app at the pinned commit (ConfigMap customer-app-source) with a read-only
        # deploy key (Secret git-customer-repo from OpenBao secret/envs/platform/git-customer-repo). If the checkout
        # fails (e.g. the deploy key is not registered yet) the root stays empty and the collector answers 503
        # inventory_root_empty with the reason in /srv/app/.checkout-error; the rest of the collector keeps working.
        - name: checkout
          image: docker.io/alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
          command: ["sh", "-c"]
          args:
            - |
              set -u
              umask 022   # checked-out files must be readable by the collector (uid 10001); the key is chmod 600
              # The key comes from OpenBao without its final newline, which OpenSSH needs: add it back.
              [ -s /etc/bravo/git-key/ssh-privatekey ] || { echo "no deploy key" > /srv/app/.checkout-error; exit 0; }
              { cat /etc/bravo/git-key/ssh-privatekey; echo; } > /tmp/key && chmod 0600 /tmp/key
              export GIT_SSH_COMMAND="ssh -i /tmp/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/bravo/git/known_hosts -o StrictHostKeyChecking=yes"
              export HOME=/tmp
              r=/srv/app
              git config --global --add safe.directory "$r"
              git_err=/tmp/git.err
              if git -C "$r" init -q && git -C "$r" remote add origin "$GIT_REPO" && git -C "$r" sparse-checkout set --no-cone "/$GIT_PATH/" \
                 && git -C "$r" fetch -q --depth 1 origin "$GIT_COMMIT" 2>"$git_err" && git -C "$r" -c advice.detachedHead=false checkout -q FETCH_HEAD; then
                rm -rf "$r/.git"; echo "checkout: $GIT_REPO $GIT_COMMIT $GIT_PATH ($(find "$r/$GIT_PATH" -type f | wc -l) files)"
              else
                rm -rf "$r/.git" "$r/$GIT_PATH"; { echo "git checkout of $GIT_COMMIT failed:"; tail -n 3 "$git_err" 2>/dev/null; } > "$r/.checkout-error"; cat "$r/.checkout-error"
              fi
              rm -f /tmp/key
          envFrom:
            - configMapRef: {name: customer-app-source}
          # OpenSSH refuses a uid without a passwd entry ("No user exists for uid 10001"); alpine has nobody (65534).
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}, runAsUser: 65534, runAsGroup: 65534}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: app, mountPath: /srv/app}
            - {name: tmp, mountPath: /tmp}
            - {name: git-key, mountPath: /etc/bravo/git-key, readOnly: true}
            - {name: git-known-hosts, mountPath: /etc/bravo/git, readOnly: true}
      containers:
        - name: collector
          image: bravo/collector
          args: ["serve"]
          env:
            - {name: BRAVO_ENVIRONMENTS_FILE, value: /etc/bravo/environments.yaml}
            - {name: BRAVO_INVENTORY_ROOT, value: /srv/app/apps/demo}
            - {name: BRAVO_COLLECTOR_HOST, value: 0.0.0.0}
            - {name: BRAVO_COLLECTOR_PORT, value: "8083"}
            - {name: BRAVO_EVIDENCE_TTL_S, value: "3600"}
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            # 수집 역할(읽기): eks:DescribeCluster on bravo-source + EKS access entry group bravo-collector.
            - {name: AWS_ROLE_ARN, value: "arn:aws:iam::721622471953:role/bravo-platform-collector-ro-25e58db04e5bb0ea1f58d7f626"}
            - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/sts.amazonaws.com/serviceaccount/token}
            - {name: BRAVO_ONPREM_KUBECONFIG, value: /etc/bravo/onprem/kubeconfig}
            # GET /v1/cost (T1, NFR-8): inventory and price config, no secrets. The IAM policy cost-receipt-read on the
            # role above (infra/envs/platform-aws rke2.tf) adds Cost Explorer, Pricing and Describe reads.
            - {name: BRAVO_COST_CONFIG, value: /etc/bravo/cost.yaml}
            # GCP reads (target project inventory + Billing Catalog prices) through Workload Identity Federation: the
            # pod's own token (audience bravo-platform-gcp-wif) -> GCP STS. No key file (infra/envs/target-gcp
            # platform_cost_reader.tf, viewer roles only).
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /etc/bravo/gcp/credential.json}
            # Cloudflare read token and ids (optional Secret collector-cloudflare, piped from OpenBao). Absent: the
            # receipt shows Cloudflare LB as "연결 안 됨" with that reason.
            - {name: CLOUDFLARE_API_TOKEN, valueFrom: {secretKeyRef: {name: collector-cloudflare, key: api_token, optional: true}}}
            - {name: CLOUDFLARE_ACCOUNT_ID, valueFrom: {secretKeyRef: {name: collector-cloudflare, key: account_id, optional: true}}}
            - {name: CLOUDFLARE_ZONE_ID, valueFrom: {secretKeyRef: {name: collector-cloudflare, key: zone_id, optional: true}}}
          ports: [{name: http, containerPort: 8083}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: registry, mountPath: /etc/bravo/environments.yaml, subPath: environments.yaml, readOnly: true}
            - {name: cost-config, mountPath: /etc/bravo/cost.yaml, subPath: cost.yaml, readOnly: true}
            - {name: gcp-wif, mountPath: /etc/bravo/gcp, readOnly: true}
            - {name: gcp-token, mountPath: /var/run/secrets/gcp, readOnly: true}
            - {name: onprem, mountPath: /etc/bravo/onprem, readOnly: true}
            - {name: aws-token, mountPath: /var/run/secrets/sts.amazonaws.com/serviceaccount, readOnly: true}
            - {name: app, mountPath: /srv/app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: git-key, secret: {secretName: git-customer-repo, optional: true, defaultMode: 0440}}
        - {name: git-known-hosts, configMap: {name: github-known-hosts}}
        - {name: registry, configMap: {name: environments}}
        - {name: cost-config, configMap: {name: cost-config}}
        - {name: gcp-wif, configMap: {name: gcp-wif-collector}}
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken: {audience: bravo-platform-gcp-wif, expirationSeconds: 3600, path: token}
        - {name: onprem, secret: {secretName: onprem-kubeconfig, optional: true}}
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: token}
        # FR-2 static inventory of the customer app: filled by the checkout init container.
        - {name: app, emptyDir: {sizeLimit: 128Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: collector, namespace: bravo-control, labels: {app.kubernetes.io/name: collector}}
spec:
  selector: {app.kubernetes.io/name: collector}
  ports: [{name: http, port: 8083, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gate, namespace: bravo-control}
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: bravo-control
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
# The gate's own read identity per environment (deploy/platform/link/gate-rbac/README.md, scripts/gate-credentials.sh):
# - source-aws: web identity role bravo-platform-gate-ro-* (EKS access entry group bravo-gate, S3 canary only, read-only
#   facts); OBJ-05 "other credential" = profile gate-other (role without permissions) in AWS_CONFIG_FILE.
#   K8s over the D-16 link src-k8s (registry api_server), Postgres over src-db (registry dial_host).
# - target-onprem: kubeconfig Secret gate-onprem-kubeconfig (SA kube-system/bravo-gate, link dst-k8s); RGW through the
#   link dst-s3 behind the s3-local sidecar (127.0.0.1:18443, the RGW certificate has IP SAN 127.0.0.1) and its plain
#   listener through dst-s3http (127.0.0.1:18080, OBJ-06); Postgres over dst-db.
# - target-gcp: Google SA bravo-gate-ro via WIF (pod token audience bravo-platform-gcp-wif, no key file) for the GKE API
#   over the link gke-k8s, the container API and Cloud Audit Logs; GCS HMAC from gate-credentials; Postgres over gke-db.
# - OpenBao (on-prem and GKE app secrets): Kubernetes-auth roles gate-meta / gate-other of this service account.
# Secret gate-credentials (DSNs of role gate_ro, object-store keys) and ConfigMap gate-ca (public CAs) are piped from
# OpenBao by gate-credentials.sh; both optional, so a missing one gives UNKNOWN answers, not a crash loop.
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: gate}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
    spec:
      serviceAccountName: gate
      automountServiceAccountToken: false
      nodeSelector: {bravo.io/pool: core}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # SEC-GIT-PLAINTEXT (spec §8.5 "Git 평문 비밀 0건", gitleaks): sparse checkout of the customer app at the pinned
        # commit, same ConfigMap customer-app-source and read-only deploy key (Secret git-customer-repo, OpenBao
        # secret/envs/platform/git-customer-repo) as the collector's init container. The gate scans every file there,
        # including the ones the collector withholds from its snapshot. On failure the reason is in
        # /srv/repo/.checkout-error and the question answers UNKNOWN; the gate still starts.
        - name: checkout
          image: docker.io/alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
          command: ["sh", "-c"]
          args:
            - |
              set -u
              umask 022
              [ -s /etc/bravo/git-key/ssh-privatekey ] || { echo "no deploy key" > /srv/repo/.checkout-error; exit 0; }
              { cat /etc/bravo/git-key/ssh-privatekey; echo; } > /tmp/key && chmod 0600 /tmp/key
              export GIT_SSH_COMMAND="ssh -i /tmp/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/bravo/git/known_hosts -o StrictHostKeyChecking=yes"
              export HOME=/tmp
              r=/srv/repo
              git config --global --add safe.directory "$r"
              if git -C "$r" init -q && git -C "$r" remote add origin "$GIT_REPO" && git -C "$r" sparse-checkout set --no-cone "/$GIT_PATH/" \
                 && git -C "$r" fetch -q --depth 1 origin "$GIT_COMMIT" 2>/tmp/git.err && git -C "$r" -c advice.detachedHead=false checkout -q FETCH_HEAD; then
                rm -rf "$r/.git"; echo "checkout: $GIT_REPO $GIT_COMMIT $GIT_PATH ($(find "$r/$GIT_PATH" -type f | wc -l) files)"
              else
                rm -rf "$r/.git" "$r/$GIT_PATH"; { echo "git checkout of $GIT_COMMIT failed:"; tail -n 3 /tmp/git.err 2>/dev/null; } > "$r/.checkout-error"; cat "$r/.checkout-error"
              fi
              rm -f /tmp/key
          envFrom:
            - configMapRef: {name: customer-app-source}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}, runAsUser: 65534, runAsGroup: 65534}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: repo, mountPath: /srv/repo}
            - {name: tmp, mountPath: /tmp}
            - {name: git-key, mountPath: /etc/bravo/git-key, readOnly: true}
            - {name: git-known-hosts, mountPath: /etc/bravo/git, readOnly: true}
        # Native sidecar: local TCP ends of the D-16 RGW links (same forwarder as the executor's s3-local).
        - name: s3-local
          image: bravo/gate
          restartPolicy: Always
          command: [python, -c]
          args:
            - |
              import asyncio
              LINKS = {18443: ("dst-s3.bravo-link.svc.cluster.local", 443), 18080: ("dst-s3http.bravo-link.svc.cluster.local", 80)}
              async def pipe(r, w):
                  try:
                      while (b := await r.read(65536)):
                          w.write(b); await w.drain()
                  finally:
                      w.close()
              def handler(up):
                  async def handle(cr, cw):
                      try:
                          ur, uw = await asyncio.wait_for(asyncio.open_connection(*up), 15)
                      except Exception as exc:
                          print(f"s3-local: upstream {up[0]}:{up[1]} failed: {type(exc).__name__}", flush=True); cw.close(); return
                      await asyncio.gather(pipe(cr, uw), pipe(ur, cw), return_exceptions=True)
                  return handle
              async def main():
                  servers = [await asyncio.start_server(handler(up), "127.0.0.1", port) for port, up in LINKS.items()]
                  print("s3-local: " + ", ".join(f"127.0.0.1:{p} -> {h}:{u}" for p, (h, u) in LINKS.items()), flush=True)
                  await asyncio.gather(*(s.serve_forever() for s in servers))
              asyncio.run(main())
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 5m, memory: 24Mi}, limits: {memory: 64Mi}}
      containers:
        - name: gate
          image: bravo/gate
          args: ["serve"]
          env:
            - {name: BRAVO_ENVIRONMENTS_FILE, value: /etc/bravo/environments.yaml}
            - {name: BRAVO_GATE_HOST, value: 0.0.0.0}
            - {name: BRAVO_GATE_PORT, value: "8084"}
            - {name: BRAVO_EVIDENCE_TTL_S, value: "3600"}
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - {name: AWS_ROLE_ARN, value: "arn:aws:iam::721622471953:role/bravo-platform-gate-ro-2b24fe0681c6862267032bbfb8"}
            - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/sts.amazonaws.com/serviceaccount/token}
            - {name: AWS_CONFIG_FILE, value: /etc/bravo/aws/config}
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /etc/bravo/gcp/credential.json}
            - {name: BRAVO_ONPREM_KUBECONFIG, value: /etc/bravo/onprem/kubeconfig}
            - {name: SRC_PG_CA, value: /etc/bravo/gate-ca/source-aws-chat-db.crt}
            - {name: ONPREM_PG_CA, value: /etc/bravo/gate-ca/target-onprem-chat-db.crt}
            - {name: GCP_PG_CA, value: /etc/bravo/gate-ca/target-gcp-chat-db.crt}
            # kube-bench summaries attached to every report as cis_benchmark (not judged; docs/evidence/kube-bench/)
            - {name: BRAVO_GATE_CIS_EVIDENCE_FILE, value: /etc/bravo/cis/gate-cis-evidence.json}
          envFrom:
            - secretRef: {name: gate-credentials, optional: true}
            - configMapRef: {name: customer-app-source}   # GIT_REPO / GIT_COMMIT for the SEC-GIT-PLAINTEXT evidence
          ports: [{name: http, containerPort: 8084}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 30m, memory: 256Mi}, limits: {memory: 1Gi}}  # parallel POST runs OOM-killed at 512Mi (11/3 04:0x)
          volumeMounts:
            - {name: registry, mountPath: /etc/bravo/environments.yaml, subPath: environments.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: aws-token, mountPath: /var/run/secrets/sts.amazonaws.com/serviceaccount, readOnly: true}
            - {name: aws-config, mountPath: /etc/bravo/aws, readOnly: true}
            - {name: gcp-wif, mountPath: /etc/bravo/gcp, readOnly: true}
            - {name: gcp-token, mountPath: /var/run/secrets/gcp, readOnly: true}
            - {name: onprem-kubeconfig, mountPath: /etc/bravo/onprem, readOnly: true}
            - {name: gate-ca, mountPath: /etc/bravo/gate-ca, readOnly: true}
            - {name: bao-ca, mountPath: /etc/bravo/openbao, readOnly: true}
            - {name: bao-jwt, mountPath: /var/run/secrets/openbao, readOnly: true}
            - {name: repo, mountPath: /srv/repo, readOnly: true}
            - {name: cis-evidence, mountPath: /etc/bravo/cis, readOnly: true}
      volumes:
        - {name: registry, configMap: {name: environments}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: repo, emptyDir: {sizeLimit: 64Mi}}
        - {name: git-key, secret: {secretName: git-customer-repo, optional: true, defaultMode: 0440}}
        - {name: git-known-hosts, configMap: {name: github-known-hosts}}
        - {name: cis-evidence, configMap: {name: gate-cis-evidence}}
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: token}
        - {name: aws-config, configMap: {name: gate-aws-config}}
        - {name: gcp-wif, configMap: {name: gcp-wif-gate}}
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken: {audience: bravo-platform-gcp-wif, expirationSeconds: 3600, path: token}
        - {name: onprem-kubeconfig, secret: {secretName: gate-onprem-kubeconfig, optional: true, defaultMode: 0440}}
        - {name: gate-ca, configMap: {name: gate-ca, optional: true}}
        # OpenBao Kubernetes auth (roles gate-meta, gate-other; keys.sh gate-bao-setup): SEC-SECRET-STORE-READ and
        # SEC-SECRET-AT-REST on targets whose app secrets live in the platform OpenBao.
        - {name: bao-ca, configMap: {name: openbao-ca}}
        - name: bao-jwt
          projected:
            sources:
              - serviceAccountToken: {expirationSeconds: 3600, path: token}
---
apiVersion: v1
kind: Service
metadata: {name: gate, namespace: bravo-control, labels: {app.kubernetes.io/name: gate}}
spec:
  selector: {app.kubernetes.io/name: gate}
  ports: [{name: http, port: 8084, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rehearsal, namespace: bravo-control}
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
# OpenBao Kubernetes auth (keys.sh gate-bao-setup, roles gate-meta / gate-other) reviews the gate's own JWT.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bravo-gate-tokenreview, labels: {app.kubernetes.io/part-of: bravo-platform}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: gate, namespace: bravo-control}
---
# OpenBao Kubernetes auth (keys.sh k8s-auth-setup) uses this account's own JWT for TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bravo-rehearsal-tokenreview, labels: {app.kubernetes.io/part-of: bravo-platform}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: rehearsal, namespace: bravo-control}
---
# Rehearsal service (S2, Harbor 0.25.0 Trials on the on-prem cluster). Inputs (platform/rehearsal/.env.example):
# - target cluster: Secret rehearsal-kubeconfig = kube-system/bravo-rehearsal on the on-prem cluster through the D-16
#   link dst-k8s (t1-dst-k8s, Access service token); writes confined to rehearsal-*/verify-* by a
#   ValidatingAdmissionPolicy (deploy/platform/link/onprem-rbac/rehearsal.yaml).
# - OpenBao: Kubernetes auth role rehearsal -> policy platform-rehearsal (mints one-use llm-claude secret_ids).
# - API token shared with api, Trial token key: Secret platform-rehearsal (OpenBao secret/envs/platform/rehearsal).
# - Sandbox and verifier images: digest-pinned values come from the on-prem / rehearsal lane (images loaded on the
#   on-prem nodes). Until set, Trials are refused with the service's own reason (no simulation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rehearsal
  namespace: bravo-control
  labels: {app.kubernetes.io/name: rehearsal, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rehearsal}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rehearsal, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
    spec:
      serviceAccountName: rehearsal
      automountServiceAccountToken: false
      nodeSelector: {bravo.io/pool: core}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: rehearsal
          image: bravo/rehearsal
          env:
            - {name: BRAVO_GATE_URL, value: "http://gate:8084"}
            - {name: BRAVO_REHEARSAL_TRIALS_DIR, value: /var/lib/bravo/runs}
            - {name: BRAVO_REHEARSAL_TOOL_LAYER_URL, value: "http://127.0.0.1:8090"}
            - {name: BRAVO_REHEARSAL_KUBECONFIG, value: /etc/bravo/rehearsal/kubeconfig}
            - {name: BRAVO_REHEARSAL_KUBE_CONTEXT, value: target-onprem}
            # Digest-pinned images present on the on-prem RKE2 nodes (rehearsal lane, platform/rehearsal/docs/evidence/rke2-2026-11-02).
            - {name: BRAVO_REHEARSAL_SANDBOX_IMAGE, value: "python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159"}
            - {name: BRAVO_REHEARSAL_VERIFIER_IMAGE, value: "python:3.12-slim-bookworm@sha256:6dd8b6dab6b3adc7812bab69eca5dbdc1a5cc690ad28306d234ffb4ef8ac9753"}
            # Verification Jobs on the destination (S2, B05/P11, B11/P14). Bucket policies: the gate's own OBJ-01..06 on
            # the GATE image (keep equal to the bravo/gate pin; put it on the on-prem nodes with
            # deploy/landing-zone/scripts/import-platform-image.sh). Code fix: the destination's current app image and
            # the PostgreSQL image chat-db runs (both on the nodes).
            - {name: BRAVO_REHEARSAL_GATE_PROBE_IMAGE, value: "721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/gate@sha256:c841a75e376ae70f4d0bd95526d024941dc2826ec014bcab4d880962e3043d78"}
            - {name: BRAVO_REHEARSAL_APP_IMAGE, value: "bravo.local/bravo-demo@sha256:76e8f595d90267b3d740fdf9012cdf5c93d6337faf63e3601a1da3b2a65c262d"}
            - {name: BRAVO_REHEARSAL_DB_IMAGE, value: "ghcr.io/cloudnative-pg/postgresql:16.15-system-bookworm@sha256:639ef58e1ecca2ecb91ba6aa52f55a25fc59dd1792df99f2e99d81d85043a8d6"}
            - {name: BRAVO_REHEARSAL_PROFILES, value: /etc/bravo/profiles/destination-profiles.json}
            # Hubble drop counters of the Trial namespaces (hubble_drop_total; the agents' ring buffer keeps ~33 s).
            - {name: BRAVO_REHEARSAL_PROMETHEUS_URL, value: "http://prometheus.bravo-observe.svc:9090"}
            - {name: BRAVO_LLM_PROVIDER, value: claude_subscription}
            - {name: BRAVO_MODEL_OPUS, value: claude-opus-5-5}
            - {name: BRAVO_MODEL_HAIKU, value: claude-haiku-5-5}
            - {name: BRAVO_BAO_ADDR, value: "https://openbao.openbao.svc:8200"}
            - {name: BRAVO_BAO_CACERT, value: /etc/bravo/openbao/ca.crt}
            - {name: BRAVO_BAO_KV_MOUNT, value: secret}
            - {name: BRAVO_BAO_K8S_ROLE, value: rehearsal}
            - {name: BRAVO_BAO_K8S_MOUNT, value: kubernetes}
            - {name: BRAVO_BAO_K8S_JWT_FILE, value: /var/run/secrets/openbao/token}
            - name: BRAVO_REHEARSAL_API_TOKEN
              valueFrom: {secretKeyRef: {name: platform-rehearsal, key: api_token}}
            - name: BRAVO_REHEARSAL_TOKEN_KEY
              valueFrom: {secretKeyRef: {name: platform-rehearsal, key: token_key}}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          # Two Trials side by side (code fix + bucket policy from 0:00), each with its agent worker process.
          resources: {requests: {cpu: 50m, memory: 384Mi}, limits: {memory: 1536Mi}}
          volumeMounts:
            - {name: runs, mountPath: /var/lib/bravo}
            - {name: tmp, mountPath: /tmp}
            - {name: kube, mountPath: /etc/bravo/rehearsal, readOnly: true}
            - {name: bao-ca, mountPath: /etc/bravo/openbao, readOnly: true}
            - {name: bao-jwt, mountPath: /var/run/secrets/openbao, readOnly: true}
            - {name: profiles, mountPath: /etc/bravo/profiles, readOnly: true}
      volumes:
        - {name: runs, emptyDir: {sizeLimit: 512Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: profiles, configMap: {name: destination-profiles}}
        - {name: kube, secret: {secretName: rehearsal-kubeconfig, optional: true, defaultMode: 0440}}
        - {name: bao-ca, configMap: {name: openbao-ca}}
        - name: bao-jwt
          projected:
            sources:
              - serviceAccountToken: {expirationSeconds: 3600, path: token}
---
apiVersion: v1
kind: Service
metadata: {name: rehearsal, namespace: bravo-control, labels: {app.kubernetes.io/name: rehearsal}}
spec:
  selector: {app.kubernetes.io/name: rehearsal}
  ports: [{name: http, port: 8090, targetPort: http}]
