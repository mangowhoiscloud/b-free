# Platform API (REST, state machine, approvals; platform/api, BRAVO_MODE=api) and operator MCP
# (same image, BRAVO_MODE=mcp, D-18). 2 replicas each across AZs (10-cluster-overview 2.1).
# Login: Cloudflare Access JWT only (ConfigMap platform-access: team domain, console / MCP AUD by path; the API
# fetches the team JWKS itself). First-login roles from Secret access-members, delivered from OpenBao.
# No dev login, no public bypass. The API resolves environment secret_refs from OpenBao metadata only, with a
# token from Kubernetes auth role api (sidecar bao-login, policy platform-api-secretref).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: bravo-control
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
# OpenBao Kubernetes auth uses this account's own JWT for TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bravo-api-tokenreview, labels: {app.kubernetes.io/part-of: bravo-platform}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: api, namespace: bravo-control}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bravo-control
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: control}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      nodeSelector: {bravo.io/pool: core}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: api}}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # OpenBao Kubernetes auth (keys.sh k8s-auth-setup, role api): logs in with this pod's service-account JWT
        # and keeps a 1h token in a memory volume for BRAVO_BAO_TOKEN_FILE. The token never leaves the pod.
        - name: bao-login
          image: bravo/api
          restartPolicy: Always
          command: ["python", "-c"]
          args:
            - |
              import json, os, ssl, time, urllib.request
              addr = os.environ["BAO_ADDR"]; ctx = ssl.create_default_context(cafile=os.environ["BAO_CACERT"])
              out = "/var/run/bravo-bao/token"
              while True:
                  try:
                      jwt = open("/var/run/secrets/openbao/token").read().strip()
                      req = urllib.request.Request(addr + "/v1/auth/kubernetes/login", method="POST",
                          data=json.dumps({"role": "api", "jwt": jwt}).encode(), headers={"Content-Type": "application/json"})
                      tok = json.load(urllib.request.urlopen(req, context=ctx, timeout=10))["auth"]["client_token"]
                      tmp = out + ".tmp"
                      with open(tmp, "w") as f: f.write(tok)
                      os.chmod(tmp, 0o600); os.replace(tmp, out)
                      print("bao-login: token refreshed (role api, value not shown)", flush=True)
                      time.sleep(1800)
                  except Exception as exc:
                      print(f"bao-login: login failed: {type(exc).__name__}", flush=True)
                      time.sleep(30)
          env:
            - {name: BAO_ADDR, value: "https://openbao.openbao.svc:8200"}
            - {name: BAO_CACERT, value: /etc/bravo/openbao/ca.crt}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 5m, memory: 32Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: bao-token, mountPath: /var/run/bravo-bao}
            - {name: bao-ca, mountPath: /etc/bravo/openbao, readOnly: true}
            - {name: bao-jwt, mountPath: /var/run/secrets/openbao, readOnly: true}
      containers:
        - name: api
          image: bravo/api
          env:
            - {name: BRAVO_MODE, value: api}
            - {name: PORT, value: "8080"}
            - {name: OTEL_SERVICE_NAME, value: api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.bravo-observe.svc:4317"}
            - {name: OTEL_EXPORTER_OTLP_INSECURE, value: "true"}
            - name: BRAVO_ACCESS_TEAM_DOMAIN
              valueFrom: {configMapKeyRef: {name: platform-access, key: team_domain}}
            - {name: BRAVO_ACCESS_MEMBERS_FILE, value: /etc/bravo/access/members.json}
            - name: BRAVO_CONSOLE_AUD
              valueFrom: {configMapKeyRef: {name: platform-access, key: console_aud}}
            - name: BRAVO_MCP_AUD
              valueFrom: {configMapKeyRef: {name: platform-access, key: mcp_aud}}
            - {name: BRAVO_EXECUTOR_URL, value: "http://executor.bravo-control.svc:8081"}
            - {name: BRAVO_REHEARSAL_URL, value: "http://rehearsal.bravo-control.svc:8090"}
            - {name: BRAVO_COLLECTOR_URL, value: "http://collector.bravo-control.svc:8083"}
            - {name: BRAVO_GATE_URL, value: "http://gate.bravo-control.svc:8084"}
            # The plan evaluation run (POST, write probes, NET-PATHS probe Pods, audit window) measured 30-60 s.
            - {name: BRAVO_GATE_TIMEOUT_S, value: "150"}
            - {name: BRAVO_CONSOLE_BASE_URL, value: "https://b-free.mangowhois.ai"}
            - {name: BRAVO_CORS_ORIGINS, value: "https://b-free.mangowhois.ai"}
            - {name: BRAVO_GATE_MAX_LAG_BYTES, value: "65536"}
            - {name: BRAVO_GATE_REQUIRED_CONTROLS, value: "DB-ANON-READ,DB-AUTH"}
            - name: BRAVO_SSE_TICKET_SECRET
              valueFrom: {secretKeyRef: {name: platform-api, key: sse_ticket_secret}}
            - name: BRAVO_REHEARSAL_API_TOKEN
              valueFrom: {secretKeyRef: {name: platform-rehearsal, key: api_token}}
            - {name: BRAVO_BAO_ADDR, value: "https://openbao.openbao.svc:8200"}
            - {name: BRAVO_BAO_CACERT, value: /etc/bravo/openbao/ca.crt}
            - {name: BRAVO_BAO_KV_MOUNT, value: secret}
            - {name: BRAVO_BAO_TOKEN_FILE, value: /var/run/bravo-bao/token}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: api}}
            - name: BRAVO_DATABASE_URL
              value: postgresql://bravo_api:$(DB_PASSWORD)@platform-db-rw.bravo-control.svc:5432/bravo?sslmode=verify-full&sslrootcert=/etc/bravo/pg-ca/ca.crt
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 50m, memory: 160Mi}, limits: {memory: 384Mi}}
          volumeMounts:
            - {name: access-members, mountPath: /etc/bravo/access, readOnly: true}
            - {name: bao-token, mountPath: /var/run/bravo-bao, readOnly: true}
            - {name: bao-ca, mountPath: /etc/bravo/openbao, readOnly: true}
            - {name: pg-ca, mountPath: /etc/bravo/pg-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: access-members, secret: {secretName: access-members}}
        - {name: bao-token, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: bao-ca, configMap: {name: openbao-ca}}
        - name: bao-jwt
          projected:
            sources:
              - serviceAccountToken: {expirationSeconds: 3600, path: token}
        - {name: pg-ca, secret: {secretName: platform-db-ca, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: bravo-control, labels: {app.kubernetes.io/name: api}}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: bravo-control}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: api}}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: operator-mcp, namespace: bravo-control}
automountServiceAccountToken: false
imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
---
