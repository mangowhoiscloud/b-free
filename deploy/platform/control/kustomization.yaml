  - name: bravo/console
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/console
    digest: sha256:9db331e04ff03d85c368901fabff632fdc8e984765da87b5a79080ea26f5da89 # r15 (console lane: gate rows show measuring source, sources_disagree stays blocked)
  - name: bravo/gate
