# Platform services on the platform EKS (bravo-control). Images: platform ECR by digest (§8.8, T7),
# the same arm64 images the laptop pilot ran (tags pilot-<image id>), pushed 2026-11-02.
# Render with: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/platform/control
# (the executor migrations ConfigMap reads platform/executor/migrations, outside this directory).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bravo-control
resources:
  - namespace.yaml
  - ../ecr-pull
  - access.yaml
  - platform-db.yaml
  - migrate-job.yaml
  - api.yaml
  - console.yaml
  - services.yaml
  - executor.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: customer-app-source
    envs:
      - config/customer-app-source.env
  - name: github-known-hosts
    files:
      - known_hosts=config/github_known_hosts
  - name: access-members
    files:
      - members.json=../access/members.json
  - name: environments
    files:
      - environments.yaml=config/environments.yaml
  - name: cost-config
    files:
      - cost.yaml=config/cost.yaml
  - name: gcp-wif-collector
    files:
      - credential.json=config/gcp-wif-collector.json
  - name: executor-topology
    files:
      - topology.json=../../cloud/in-cluster/topology.json
  - name: executor-kubeconfig
    files:
      - config=../../cloud/in-cluster/kubeconfig.template.yaml
  - name: executor-migrations
    files:
      - ../../../platform/executor/migrations/0001_resource_locks.sql
      - ../../../platform/executor/migrations/0002_attachment_copies.sql
images:
  - name: bravo/api
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/api
    digest: sha256:eefdcf9f8af3e884fe6f17b47db6d34bd7542e173efe01c819f72bd9a963cff2 # cost-20261102T134535Z (obs/cost lane: + GET /v1/cost over r2-20261102T130026Z; tree at 59883af)
  - name: bravo/console
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/console
    digest: sha256:b7c1323e981054697927a3bde44f4347ce39a9ea34e4592c09f61a0a0830c6f2 # r12 (console lane: target_info min by (stale pod series), Hubble note derived from data only)
  - name: bravo/gate
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/gate
    digest: sha256:fc9ea202339249bf36881529f5409533e974d2dad55eac67f9397887355021c5 # dbauth-20261102T134943Z (gate lane: DB-AUTH judges network pg_hba rules + trust anywhere; CNPG local peer not judged)
  - name: bravo/collector
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/collector
    digest: sha256:9dc004dbb44f8b23b8935ffd7242893f1c1a1079814cfc8cf01f355969f22f8b # cost-20261102T141430Z (obs/cost lane: GET /v1/cost, KST month-start period + daily active_lines, stale-while-revalidate caches, start-up warm-up)
  - name: bravo/executor
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/executor
    digest: sha256:f5ec7dfdbe01e7a37a6fdbdde4125c12b921f99cbe51dee787b9c8b8de0caeb0 # cloud-202611022259 (data/cutover lane: + attachment_copy CLI in topology mode for T8 pre-copy in executor-0)
  - name: bravo/rehearsal
    newName: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/rehearsal
