# Platform DB migrations: API schema (platform/api migrate.py, as the owner), then the Executor tables
# (platform/executor/migrations, D-19). Same order as the pilot (migrate -> executor-migrate).
# Argo CD runs it as a Sync hook; the bootstrap script deletes and re-creates it.
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-db-migrate
  namespace: bravo-control
  labels:
    app.kubernetes.io/name: platform-db-migrate
    app.kubernetes.io/part-of: bravo-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-db-migrate
        app.kubernetes.io/part-of: bravo-platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ecr-pull}] # deploy/platform/ecr-pull
      nodeSelector:
        bravo.io/pool: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: api-migrate
          image: bravo/api
          command: ["python", "-m", "bravo_api.migrate"]
          env:
            - name: OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-owner, key: password}}
            - name: BRAVO_MIGRATE_DATABASE_URL
              value: postgresql://bravo_owner:$(OWNER_PASSWORD)@platform-db-rw.bravo-control.svc:5432/bravo?sslmode=verify-full&sslrootcert=/etc/bravo/pg-ca/ca.crt
            - name: BRAVO_API_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: api}}
            - name: BRAVO_MCP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: mcp}}
            - name: BRAVO_EXECUTOR_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: executor}}
            # T31 apply worker's DB role (migration 0007). From OpenBao secret/envs/platform/platform-db field apply.
            - name: BRAVO_APPLY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-roles, key: apply}}
            - name: BRAVO_SEED_DEV
              value: "0"
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: &res
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: pg-ca, mountPath: /etc/bravo/pg-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: executor-migrate
          image: ghcr.io/cloudnative-pg/postgresql:16.13-standard-trixie@sha256:8c25c9dcc7af607b65cfa6a125c8cae4c126a03d224dc1b6959cc279b7bf89f4
          command: ["sh", "-c", "for f in /migrations/*.sql; do echo \"executor-migrate: $f\"; psql -v ON_ERROR_STOP=1 --no-psqlrc -f \"$f\" || exit 1; done"]
          env:
            - {name: PGHOST, value: platform-db-rw.bravo-control.svc}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: bravo}
            - {name: PGUSER, value: bravo_owner}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/bravo/pg-ca/ca.crt}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-owner, key: password}}
          securityContext: *sc
          resources: *res
          volumeMounts:
            - {name: migrations, mountPath: /migrations, readOnly: true}
            - {name: pg-ca, mountPath: /etc/bravo/pg-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: migrations
          configMap: {name: executor-migrations}
        - name: pg-ca
          secret: {secretName: platform-db-ca, items: [{key: ca.crt, path: ca.crt}]}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
