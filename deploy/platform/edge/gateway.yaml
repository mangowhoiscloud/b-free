# Platform front (CLOUD-E2E-CONTRACT 3, 6): b-free.mangowhois.ai -> Cloudflare Access -> tunnel bravo-platform
# -> cloudflared (ns cf-edge) -> Gateway bravo-gateway (ns bravo-edge, Gateway API on Envoy) -> console / api / mcp.
apiVersion: v1
kind: Namespace
metadata:
  name: bravo-edge
  labels:
    app.kubernetes.io/part-of: bravo-platform
    pod-security.kubernetes.io/enforce: restricted
---
# Gateway API on the platform RKE2 node: the Cilium implementation (TECH-STACK-SPEC 1 "Gateway API(Envoy, Cilium
# 구현)", same as the landing zone, deploy/landing-zone). Cilium runs standalone with kube-proxy replacement
# (RKE2 cni: none), so Envoy reaches every backend; the EKS-chaining limit (deploy/platform/envoy-gateway/values.yaml)
# no longer applies. The Service cilium-gateway-bravo-gateway is NodePort through CiliumGatewayClassConfig:
# no cloud load balancer, the tunnel is the only entry (inbound 0, D-16).
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: bravo-nodeport
  namespace: bravo-edge
spec:
  description: "NodePort only, no cloud LB (tunnel is the only entry)"
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bravo-cilium
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: bravo-nodeport
    namespace: bravo-edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bravo-gateway
  namespace: bravo-edge
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  gatewayClassName: bravo-cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: b-free.mangowhois.ai
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [bravo-control, bravo-observe]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-front
  namespace: bravo-control
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  parentRefs:
    - name: bravo-gateway
      namespace: bravo-edge
      sectionName: http
  hostnames: ["b-free.mangowhois.ai"]
  rules:
    # API (REST + SSE). No route timeout: SSE streams stay open.
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs: [{name: api, port: 8080}]
      timeouts: {request: "0s"}
    # Operator MCP (streamable HTTP, D-18).
    - matches: [{path: {type: PathPrefix, value: /mcp}}]
      backendRefs: [{name: operator-mcp, port: 8082}]
      timeouts: {request: "0s"}
    # Console (static files + its read-only /svc proxy).
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: console, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: bravo-observe
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  parentRefs:
    - name: bravo-gateway
      namespace: bravo-edge
      sectionName: http
  hostnames: ["b-free.mangowhois.ai"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /grafana}}]
      backendRefs: [{name: grafana, port: 3000}]
      timeouts: {request: "0s"}
---
# Plain HTTP at the edge -> 301 to https, at the origin (D-29 finding, 2026-11-03). b-free is a Cloudflare Access app,
# which already answers http:// with 301 before the tunnel; this is the origin-side rule for any path that reaches the
# Gateway with the visitor's scheme http. cloudflared -> Gateway is plain HTTP, so X-Forwarded-Proto is always "http"
# here (measured); Cloudflare's CF-Visitor carries the visitor's scheme. One match per path prefix of platform-front and
# grafana: on the same path the rule with more header matches wins, a shorter prefix would lose to a longer one.
# A new path prefix on b-free needs its line here too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: bravo-control
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  parentRefs:
    - name: bravo-gateway
      namespace: bravo-edge
      sectionName: http
  hostnames: ["b-free.mangowhois.ai"]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /}, headers: [{type: Exact, name: CF-Visitor, value: '{"scheme":"http"}'}]}
        - {path: {type: PathPrefix, value: /v1}, headers: [{type: Exact, name: CF-Visitor, value: '{"scheme":"http"}'}]}
        - {path: {type: PathPrefix, value: /mcp}, headers: [{type: Exact, name: CF-Visitor, value: '{"scheme":"http"}'}]}
        - {path: {type: PathPrefix, value: /grafana}, headers: [{type: Exact, name: CF-Visitor, value: '{"scheme":"http"}'}]}
      filters:
        - {type: RequestRedirect, requestRedirect: {scheme: https, statusCode: 301}}

