# Platform front (CLOUD-E2E-CONTRACT 3, 6): b-free.mangowhois.ai -> Cloudflare Access -> tunnel bravo-platform
# -> cloudflared (ns cf-edge) -> Gateway bravo-gateway (ns bravo-edge, Gateway API on Envoy) -> console / api / mcp.
apiVersion: v1
kind: Namespace
metadata:
  name: bravo-edge
  labels:
    app.kubernetes.io/part-of: bravo-platform
    pod-security.kubernetes.io/enforce: restricted
---
# Envoy Gateway (deploy/platform/envoy-gateway): proxies run in this namespace as ordinary pods with VPC
# addresses, behind a ClusterIP Service named bravo-gateway (no cloud load balancer, inbound 0, D-16).
# The Cilium implementation could not reach backends across nodes in VPC CNI chaining mode (see
# deploy/platform/envoy-gateway/values.yaml). Tunnel origin: http://bravo-gateway.bravo-edge.svc.cluster.local:80.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: bravo-front
  namespace: bravo-edge
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: bravo-gateway
        type: ClusterIP
      envoyDeployment:
        replicas: 2
        pod:
          nodeSelector:
            bravo.io/pool: core
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: bravo-gateway
        container:
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bravo-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: bravo-front
    namespace: bravo-edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bravo-gateway
  namespace: bravo-edge
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  gatewayClassName: bravo-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: b-free.mangowhois.ai
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: bravo-control
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-front
  namespace: bravo-control
  labels:
    app.kubernetes.io/part-of: bravo-platform
spec:
  parentRefs:
    - name: bravo-gateway
      namespace: bravo-edge
      sectionName: http
  hostnames: ["b-free.mangowhois.ai"]
  rules:
    # API (REST + SSE). No route timeout: SSE streams stay open.
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs: [{name: api, port: 8080}]
      timeouts: {request: "0s"}
    # Operator MCP (streamable HTTP, D-18).
    - matches: [{path: {type: PathPrefix, value: /mcp}}]
      backendRefs: [{name: operator-mcp, port: 8082}]
      timeouts: {request: "0s"}
    # Console (static files + its read-only /svc proxy).
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: console, port: 8080}]
