# Register the real environments (deploy/platform/access/environments.json) for tenant b-free, created by the
# operator ryoo0504@naver.com (15-r2-contracts, platform/api admin.py). Needs that operator to have signed in once
# through Access (JIT membership row). Run with deploy/platform/scripts/register-envs.sh; it checks that first.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-envs
  namespace: bravo-control
  labels: {app.kubernetes.io/name: platform-db-migrate, app.kubernetes.io/part-of: bravo-platform}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: platform-db-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ecr-pull}]
      nodeSelector: {bravo.io/pool: core}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: register
          image: bravo/api
          command: ["python", "-m", "bravo_api.admin", "register-envs", "--file", "/etc/bravo/access/environments.json",
                    "--created-by", "ryoo0504@naver.com"]
          env:
            - name: OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-owner, key: password}}
            - name: BRAVO_MIGRATE_DATABASE_URL
              value: postgresql://bravo_owner:$(OWNER_PASSWORD)@platform-db-rw.bravo-control.svc:5432/bravo?sslmode=verify-full&sslrootcert=/etc/bravo/pg-ca/ca.crt
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: envs, mountPath: /etc/bravo/access, readOnly: true}
            - {name: pg-ca, mountPath: /etc/bravo/pg-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: envs, configMap: {name: access-environments}}
        - {name: pg-ca, secret: {secretName: platform-db-ca, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
