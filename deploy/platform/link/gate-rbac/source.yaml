# SOURCE EKS (bravo-source). Platform gate read identity: IAM role bravo-platform-gate-ro-* -> access entry group
# bravo-gate (infra/envs/platform-aws gate.tf). Only what the gate probes call; no Secret access. README.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # AUD-CONTROL-PLANE / SEC-SECRET-AT-REST (rke2): kube-apiserver audit and Secret storage transformer counters.
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bravo-gate-read}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: bravo-gate}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get]
  # NET-PATHS: one short-lived probe Pod with the app Deployment's labels and image (probes/netpod.py), deleted after.
  # Pod create in the app namespace is the widest right of this identity: it could start any image there. The Pod
  # the gate makes has no service account token, a restricted security context and a 90 s deadline.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-gate-read}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: bravo-gate}
---
# NET-PATHS probe Pod admission: the gate identity (EKS access entry group bravo-gate (IAM role bravo-platform-gate-ro-*)) may create in ns chat only the probe Pod
# that platform/gate probes/netpod.py builds. Kubernetes-native ValidatingAdmissionPolicy, no extra component.
# APP_IMAGE is the app Deployment's image, pinned by digest. When the app image changes, every probe Pod is
# denied (NET-PATHS UNKNOWN probe_pod_failed, fails closed): put the new image here and re-apply
# (deploy/platform/scripts/gate-credentials.sh rbac warns when this pin and the live Deployment differ).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bravo-gate-netprobe
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
  annotations: {bravo.io/app-image: "721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-source/bravo-demo@sha256:b5c0e7647924f37c2179fecb75c5161912cd95c0a4f1ec4524deb62fc0d135e6"}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: chat}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: gate-identity
      expression: "'bravo-gate' in request.userInfo.groups"
  validations:
    - expression: "object.spec.containers.all(c, c.image == '721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-source/bravo-demo@sha256:b5c0e7647924f37c2179fecb75c5161912cd95c0a4f1ec4524deb62fc0d135e6')"
      message: "gate probe Pod: only the app Deployment's image (pinned digest) is allowed"
    - expression: "!has(object.spec.initContainers) || size(object.spec.initContainers) == 0"
      message: "gate probe Pod: no init containers"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "gate probe Pod: automountServiceAccountToken must be false"
    - expression: "!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default'"
      message: "gate probe Pod: only the namespace's default ServiceAccount (no workload identity of the app)"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "gate probe Pod: no hostPath volume"
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)
      message: "gate probe Pod: no host network, PID or IPC namespace"
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) ||
        !c.securityContext.privileged)
      message: "gate probe Pod: no privileged container"
    - expression: "has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 90"
      message: "gate probe Pod: activeDeadlineSeconds must be set and at most 90"
    - expression: >-
        has(object.metadata.labels) && 'bravo.io/probe' in object.metadata.labels &&
        object.metadata.labels['bravo.io/probe'] == 'gate-net-paths'
      message: "gate probe Pod: label bravo.io/probe=gate-net-paths is required"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bravo-gate-netprobe
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
spec:
  policyName: bravo-gate-netprobe
  validationActions: [Deny]
