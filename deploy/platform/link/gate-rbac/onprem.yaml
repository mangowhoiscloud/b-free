# ON-PREM RKE2 (bravo-onprem). Platform gate read identity: this ServiceAccount's TokenRequest token (168h), kept only in
# OpenBao secret/envs/target-onprem/k8s-gate, used over the D-16 link dst-k8s. Only what the gate probes call. README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bravo-gate
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bravo-gate-read}
subjects:
  - {kind: ServiceAccount, name: bravo-gate, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-gate-read}
subjects:
  - {kind: ServiceAccount, name: bravo-gate, namespace: kube-system}
