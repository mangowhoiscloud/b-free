# GKE (bravo-target-gcp). Platform gate read identity: Google service account bravo-gate-ro, impersonated through
# Workload Identity Federation (infra/envs/target-gcp platform_gate_reader.tf). Only what the gate probes call. README.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # AUD-CONTROL-PLANE / SEC-SECRET-AT-REST (rke2): kube-apiserver audit and Secret storage transformer counters.
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bravo-gate-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bravo-gate-read}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: bravo-gate-ro@b-free-target-20261102.iam.gserviceaccount.com}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get]
  # NET-PATHS: one short-lived probe Pod with the app Deployment's labels and image (probes/netpod.py), deleted after.
  # Pod create in the app namespace is the widest right of this identity: it could start any image there. The Pod
  # the gate makes has no service account token, a restricted security context and a 90 s deadline.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-gate-read
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-gate-read}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: bravo-gate-ro@b-free-target-20261102.iam.gserviceaccount.com}
