# Generated for D-16 links (02-network.md 4.3). One Deployment + Service + PDB per link.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-src-k8s
  namespace: bravo-link
  labels:
    app.kubernetes.io/name: link-src-k8s
    app.kubernetes.io/component: link
    app.kubernetes.io/part-of: bravo-link
    bravo.io/link-mode: d16
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: link-src-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: link-src-k8s
        app.kubernetes.io/component: link
        app.kubernetes.io/part-of: bravo-link
        bravo.io/link-mode: d16
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 플랫폼(3 AZ)에서는 두 복제본을 반드시 다른 AZ에(02-network.md 4.3 배치).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: link-src-k8s
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          args: ["access", "tcp", "--hostname", "t1-src-k8s.mangowhois.ai", "--url", "0.0.0.0:6443", "--loglevel", "info"]
          # 2026.10.x 의 access tcp 는 서비스 토큰을 플래그나 환경 변수로만 받음(파일 옵션 없음, --help 확인).
          # 인자는 ps에 보여서 쓰지 않고 Secret 환경 변수로 받음. 회전하면 Pod를 다시 띄움(02-network.md 4.3 토큰).
          env:
            - name: TUNNEL_SERVICE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: cf-link-src-k8s
                  key: client_id
            - name: TUNNEL_SERVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: cf-link-src-k8s
                  key: client_secret
          ports:
            - name: link
              containerPort: 6443
          # TCP 연결은 cloudflared가 edge까지 서비스 토큰으로 여는 끝에서 끝 확인이 됨. 그래서 주기를 길게 둠.
          readinessProbe:
            tcpSocket:
              port: link
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: src-k8s
  namespace: bravo-link
  labels:
    app.kubernetes.io/name: link-src-k8s
    app.kubernetes.io/component: link
    app.kubernetes.io/part-of: bravo-link
    bravo.io/link-mode: d16
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: link-src-k8s
  ports:
    - name: link
      port: 443
      targetPort: link
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: link-src-k8s
  namespace: bravo-link
  labels:
    app.kubernetes.io/name: link-src-k8s
