# Applied to the GKE target (bravo-target-gcp). The platform collector impersonates the Google service account
# bravo-cost-reader through WIF (infra/envs/target-gcp platform_cost_reader.tf) and reaches the API over the D-16 link
# t1-gke-k8s. GKE names it by its email (userinfo.email scope). Read-only: exactly the
# get/list calls of platform/collector clusters.py READ_ONLY_RULES. No Secret access (not even metadata).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bravo-collector-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bravo-collector-read
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bravo-collector-read}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: bravo-cost-reader@b-free-target-20261102.iam.gserviceaccount.com}
