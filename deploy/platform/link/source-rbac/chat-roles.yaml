# Applied to the SOURCE cluster in namespace chat once it exists (CLOUD-E2E-CONTRACT 9 "Executor의 K8s 권한").
# bravo-executor: pods get/list, pods/exec (PgBouncer target switch), pods/portforward (chat-db, chat-pgbouncer,
# chat-admin). No ConfigMap or Secret rights. bravo-link: the temporary link pods' port-forward only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-executor
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-executor
  namespace: chat
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-executor}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: bravo-executor}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bravo-link
  namespace: chat
  labels: {app.kubernetes.io/part-of: bravo-platform, app.kubernetes.io/component: platform-access}
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bravo-link
  namespace: chat
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bravo-link}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: bravo-link}
