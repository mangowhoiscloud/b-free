# D-16 links consumed by the GKE target (context bravo-target-gcp). They replace the laptop reverse-tunnel agents
# (infra/envs/target-gcp/scripts/links.sh, 임시 링크(D-16 전)): each Service keeps its name and port, so ESO, the
# OTel agent and the app do not change. The pod is `cloudflared access tcp` to a hostname behind Cloudflare Access
# (Service Auth, one service token per link, kept in OpenBao secret/envs/target-gcp/cf-link-*; the Secret here is
# piped from there by deploy/platform/scripts/gke-links.sh). No laptop process, no inbound port.
---
# GKE External Secrets -> platform OpenBao (D-26): openbao.external-secrets.svc:8200 -> t1-plat-bao.mangowhois.ai
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: external-secrets
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: d16-link, app.kubernetes.io/part-of: bravo-link}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: openbao}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: d16-link, app.kubernetes.io/part-of: bravo-link}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba # 2026.10.7
          args: ["access", "tcp", "--hostname", "t1-plat-bao.mangowhois.ai", "--url", "0.0.0.0:8200", "--loglevel", "info"]
          env:
            - name: TUNNEL_SERVICE_TOKEN_ID
              valueFrom: {secretKeyRef: {name: cf-link-plat-bao, key: client_id}}
            - name: TUNNEL_SERVICE_TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: cf-link-plat-bao, key: client_secret}}
          ports: [{name: client, containerPort: 8200}]
          readinessProbe: {tcpSocket: {port: client}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: client}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: external-secrets
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/part-of: bravo-link}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: openbao}
  ports: [{name: client, port: 8200, targetPort: client}]
---
# Same-namespace clients only; out: DNS and Cloudflare edge (443 / 7844), nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao
  namespace: external-secrets
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/part-of: bravo-link}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{port: client}]
  egress:
    # GKE NodeLocal DNSCache answers the kube-dns Service address (node-local-dns pods), kube-dns behind it.
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchExpressions: [{key: k8s-app, operator: In, values: [kube-dns, node-local-dns]}]}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [169.254.169.254/32]}}]
      ports: [{port: 443, protocol: TCP}, {port: 7844, protocol: TCP}, {port: 7844, protocol: UDP}]
---
