# 고객 클러스터의 관리 Tunnel 커넥터(D-16, 02-network.md 4.1 `t1-<env>-mgmt`). 서비스를 내놓는 쪽.
# 라우트는 클러스터 안 설정 파일(config_src = local). 토큰은 Secret cf-mgmt-tunnel(키 token)에서 파일로 읽음.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-mgmt
  namespace: cf-edge
  labels:
    app.kubernetes.io/name: cloudflared-mgmt
    app.kubernetes.io/component: mgmt-tunnel
    app.kubernetes.io/part-of: cf-edge
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-mgmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-mgmt
        app.kubernetes.io/component: mgmt-tunnel
        app.kubernetes.io/part-of: cf-edge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # AZ가 하나뿐인 출발지 · 온프렘에서는 선호 조건(02-network.md 4.3 배치).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-mgmt
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba # 2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config/config.yaml
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token/token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-mgmt-config
        - name: token
          secret:
            secretName: cf-mgmt-tunnel
            defaultMode: 0400
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-mgmt
  namespace: cf-edge
  labels:
    app.kubernetes.io/name: cloudflared-mgmt
    app.kubernetes.io/part-of: cf-edge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-mgmt
