# 관리 커넥터: 들어오는 연결 없음(kubelet 프로브만). 나가는 것은 DNS, Cloudflare edge(7844 TCP/UDP, 443),
# 그리고 내놓는 원본(API 서버 443/6443, ns chat 의 DB 5432 · PgBouncer 6432)뿐.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-mgmt
  namespace: cf-edge
  labels:
    app.kubernetes.io/part-of: cf-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-mgmt
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chat
      ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 169.254.170.23/32
      ports:
        - port: 7844
          protocol: TCP
        - port: 7844
          protocol: UDP
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
