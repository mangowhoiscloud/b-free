# source-aws 관리 Tunnel t1-src-mgmt 의 라우트(config_src = local). infra/modules/edge_link 출력 connector_ingress 와 같음.
# Zero Trust를 켠 뒤 팀 이름이 정해지면 각 규칙에 originRequest.access(required, teamName, audTag)를 더함(N3).
ingress:
  - hostname: t1-src-k8s.mangowhois.ai
    service: tcp://kubernetes.default.svc:443
  - hostname: t1-src-db.mangowhois.ai
    service: tcp://chat-db-rw.chat.svc:5432
  - hostname: t1-src-pgb.mangowhois.ai
    service: tcp://chat-pgbouncer.chat.svc:6432
  - hostname: t1-src-admin.mangowhois.ai
    service: tcp://chat-admin.chat.svc:8081
  - service: http_status:404
