# bravo-observe network policies (enforced by Cilium). Default: no ingress; egress only DNS and this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-namespace
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
---
# OTLP from platform services, links, connectors and Argo CD; metrics scrape from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [bravo-control, bravo-link, cf-edge, argocd]
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 8888 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports:
        - { protocol: TCP, port: 4317 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { protocol: TCP, port: 3200 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: loki }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { protocol: TCP, port: 3100 }
---
# Grafana: same namespace only. Operators use kubectl port-forward (not subject to NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 3000 }
