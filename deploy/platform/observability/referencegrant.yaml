# Lets HTTPRoute bravo-control/grafana (cross-namespace/grafana-route.yaml) send to Service grafana. Nothing else.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: grafana-from-platform-front
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bravo-control
  to:
    - group: ""
      kind: Service
      name: grafana
