# OTel Collector 0.164.0 (contrib). Receives OTLP from platform services and, over the D-16 link t1-plat-otlp, from
# each environment's otel-agent; probes platform service health (config/otel-collector.yaml). No persistent state.
# ConfigMap openbao-ca (public CA cert, copied from bravo-control/openbao-ca by README step) verifies OpenBao TLS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector }
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      nodeSelector: { bravo.io/pool: core }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b # 0.164.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - { name: BRAVO_ENV, value: platform }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol, readOnly: true }
            - { name: openbao-ca, mountPath: /etc/bravo/openbao, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        - name: openbao-ca
          configMap: { name: openbao-ca, optional: true }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8888, targetPort: metrics }
