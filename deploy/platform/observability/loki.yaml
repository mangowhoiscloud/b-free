# Loki 3.7.9 single binary, filesystem store on a 10 Gi PVC, 72 h retention (pilot config).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
    spec:
      serviceAccountName: loki
      automountServiceAccountToken: false
      nodeSelector: { bravo.io/pool: core }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28 # 3.7.9
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: bravo-general
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: loki }
  ports:
    - { name: http, port: 3100, targetPort: http }
