# Platform observability (D-15 OTLP path, TECH-STACK-SPEC 2.6): OTel Collector -> Prometheus (metrics),
# Tempo (traces), Loki (logs) -> Grafana. Namespace bravo-observe, outside the mesh (10-cluster-overview 2.1).
# Render: kubectl kustomize deploy/platform/observability
# Secret grafana-admin is not in Git: keys.sh pipes OpenBao secret/platform/grafana (field admin_password) into it (D-26).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bravo-observe
labels:
  - pairs:
      app.kubernetes.io/part-of: bravo-platform
      app.kubernetes.io/component: observability
    includeSelectors: false
resources:
  - namespace.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - tempo.yaml
  - loki.yaml
  - grafana.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: otel-collector-config
    files: [config.yaml=config/otel-collector.yaml]
  - name: prometheus-config
    files: [prometheus.yaml=config/prometheus.yaml]
  - name: tempo-config
    files: [tempo.yaml=config/tempo.yaml]
  - name: loki-config
    files: [loki.yaml=config/loki.yaml]
  - name: grafana-datasources
    files: [datasources.yaml=config/grafana-datasources.yaml]
