# Tempo 2.10.10 single binary, local backend on a 5 Gi PVC, 72 h block retention.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  labels: { app.kubernetes.io/name: tempo }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  labels: { app.kubernetes.io/name: tempo }
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tempo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo }
    spec:
      serviceAccountName: tempo
      automountServiceAccountToken: false
      nodeSelector: { bravo.io/pool: core }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tempo
          image: grafana/tempo@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38 # 2.10.10
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            # OOMKilled at 384Mi once the GKE and platform traces arrived (2026-11-02 22:1x); single node has 16 GiB.
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo, readOnly: true }
            - { name: data, mountPath: /var/tempo }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: bravo-general
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels: { app.kubernetes.io/name: tempo }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
