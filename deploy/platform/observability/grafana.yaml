# Grafana 13.3.0 at https://b-free.mangowhois.ai/grafana/ (deep link from the console, 07 6). Two locks in series:
# 1. Cloudflare Access app bravo-platform covers the whole host, so no request reaches the Gateway without login.
# 2. Grafana itself accepts the Access JWT (header Cf-Access-Jwt-Assertion, RS256 keys from the team JWKS, aud =
#    console AUD, iss = team domain) and signs the person in as Viewer. No anonymous access, no public route.
# Route: HTTPRoute bravo-observe/grafana on Gateway bravo-gateway (deploy/platform/edge/gateway.yaml, platform lane).
# The admin password comes from Secret grafana-admin (key admin_password). That Secret is not in Git:
# keys.sh pipes OpenBao secret/platform/grafana (field admin_password) into it (D-26). Without it the pod does not start.
# Data (users, preferences) on PVC grafana-data (bravo-general); datasources are provisioned from Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      nodeSelector: { bravo.io/pool: core }
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205 # 13.3.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            # Served at https://b-free.mangowhois.ai/grafana/ through the Gateway, behind the same Access app as the
            # console (never public). Tempo and Loki are reached through Grafana Explore.
            - { name: GF_SERVER_ROOT_URL, value: "https://b-free.mangowhois.ai/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_SECURITY_ADMIN_PASSWORD__FILE, value: /run/secrets/grafana/admin_password }
            - { name: GF_PATHS_DATA, value: /var/lib/grafana }
            - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
            - { name: GF_LOG_MODE, value: console }
            # Egress is limited to DNS and this namespace: no update or plugin checks.
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            # Served under the platform host's /grafana path (Gateway path route).
            - { name: GF_SERVER_ROOT_URL, value: "https://b-free.mangowhois.ai/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            # Cloudflare Access JWT (same issuer and AUD as the platform API, deploy/platform/control/access.yaml).
            - { name: GF_AUTH_JWT_ENABLED, value: "true" }
            - { name: GF_AUTH_JWT_HEADER_NAME, value: Cf-Access-Jwt-Assertion }
            - { name: GF_AUTH_JWT_EMAIL_CLAIM, value: email }
            - { name: GF_AUTH_JWT_USERNAME_CLAIM, value: email }
            - { name: GF_AUTH_JWT_JWK_SET_URL, value: "https://falling-rain-1f1c.cloudflareaccess.com/cdn-cgi/access/certs" }
            - { name: GF_AUTH_JWT_CACHE_TTL, value: 10m }
            - name: GF_AUTH_JWT_EXPECT_CLAIMS
              value: '{"iss": "https://falling-rain-1f1c.cloudflareaccess.com", "aud": ["bcaacf0741fb858e899a672ebd8f93e0fdf35c8ddf112b85bec7cbf6c2493443"]}'
            - { name: GF_AUTH_JWT_AUTO_SIGN_UP, value: "true" }
            - { name: GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT, value: "false" }
            - { name: GF_USERS_AUTO_ASSIGN_ORG_ROLE, value: Viewer }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /grafana/api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /grafana/api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: admin, mountPath: /run/secrets/grafana, readOnly: true }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: admin
          secret:
            secretName: grafana-admin
            items: [{ key: admin_password, path: admin_password }]
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels: { app.kubernetes.io/name: grafana }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: bravo-general
  resources:
    requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http }
