# https://b-free.mangowhois.ai/grafana/ -> Grafana (bravo-observe). The Gateway bravo-gateway (bravo-edge, owned by the
# platform lane) admits routes from bravo-control only, so the route lives there and a ReferenceGrant in
# bravo-observe (../referencegrant.yaml) lets it point at Service grafana. Longest prefix wins over the console's "/".
# Access app bravo-platform covers the whole host: no request reaches this route without login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: bravo-control
spec:
  parentRefs:
    - name: bravo-gateway
      namespace: bravo-edge
      sectionName: http
  hostnames: ["b-free.mangowhois.ai"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /grafana}}]
      backendRefs: [{name: grafana, namespace: bravo-observe, port: 3000}]
