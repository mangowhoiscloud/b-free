# From deploy/pilot/observability/prometheus.yaml, adapted for the platform EKS (ns bravo-observe).
global: { scrape_interval: 15s }
otlp:
  promote_resource_attributes: [service.name, service.namespace, deployment.environment.name, bravo.env, bravo.plan_id]
storage:
  tsdb: { out_of_order_time_window: 30m }
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector.bravo-observe.svc:8888"] }]
