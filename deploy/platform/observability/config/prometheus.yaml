# Prometheus for the platform (ns bravo-observe). Metrics arrive mainly by OTLP from the platform Collector
# (platform services, spanmetrics, httpcheck, and every environment's agent over the D-16 link t1-plat-otel).
global: { scrape_interval: 15s }
otlp:
  promote_resource_attributes: [service.name, service.namespace, deployment.environment.name, bravo.env, bravo.plan_id]
storage:
  tsdb: { out_of_order_time_window: 30m }
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector.bravo-observe.svc:8888"] }]
  # Hubble metrics of the platform node itself (Cilium hubble.metrics, headless Service kube-system/hubble-metrics).
  # Empty until the platform Cilium enables hubble.metrics (platform lane, deploy/platform/cilium).
  - job_name: hubble
    scrape_interval: 30s
    dns_sd_configs:
      - { names: [hubble-metrics.kube-system.svc.cluster.local], type: A, port: 9965 }
    relabel_configs:
      - { target_label: bravo_env, replacement: platform }
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "hubble_(flows_processed_total|drop_total|tcp_flags_total|lost_events_total)"
        action: keep
