# From deploy/pilot/observability/otel-collector.yaml, adapted for the platform EKS (ns bravo-observe).
# One OTLP entry point for every platform service; split to Tempo, Prometheus, Loki (07 6).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
  resource:
    attributes:
      - { key: deployment.environment.name, value: "${env:BRAVO_ENV}", action: upsert }
      - { key: bravo.env, value: "${env:BRAVO_ENV}", action: upsert }
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo.bravo-observe.svc:4317
    tls: { insecure: true }   # in-cluster plain gRPC; mesh mTLS is the proposal D-15 (bravo-observe stays outside the mesh)
  otlphttp/prometheus:
    endpoint: http://prometheus.bravo-observe.svc:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://loki.bravo-observe.svc:3100/otlp
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/tempo] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/prometheus] }
    logs:    { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki] }
