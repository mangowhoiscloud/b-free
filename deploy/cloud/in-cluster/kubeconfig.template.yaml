# kubeconfig for executor-0 (mount read-only, KUBECONFIG=/etc/bravo/kube/config). No secret inside:
# - bravo-source: EKS bearer token from the pod's Pod Identity (python -m bravo_executor.ekstoken).
# - bravo-onprem: K3s API through the link Service dst-k8s (D-16 name; temporary link today), client
#   token read from a file the platform delivers from OpenBao (secret/envs/target-onprem/k8s-executor).
# RBAC on each cluster: ns chat, pods/exec on the chat-pgbouncer Pod, pods get/list (contract §9).
apiVersion: v1
kind: Config
clusters:
  - name: bravo-source
    cluster:
      server: https://src-k8s.bravo-link.svc.cluster.local:443
      tls-server-name: kubernetes.default.svc
      certificate-authority: /etc/bravo/kube/source-ca.crt
  - name: bravo-onprem
    cluster:
      server: https://dst-k8s.bravo-link.svc.cluster.local:443
      tls-server-name: kubernetes.default.svc
      certificate-authority: /etc/bravo/kube/onprem-ca.crt
users:
  - name: executor-source
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: python
        args: ["-m", "bravo_executor.ekstoken", "bravo-source", "ap-northeast-2"]
        interactiveMode: Never
  - name: executor-onprem
    user:
      tokenFile: /etc/bravo/secrets/envs__target-onprem__k8s-executor/token
contexts:
  - name: bravo-source
    context: {cluster: bravo-source, user: executor-source, namespace: chat}
  - name: bravo-onprem
    context: {cluster: bravo-onprem, user: executor-onprem, namespace: chat}
current-context: bravo-source
