[project]
name = "bravo-audit"
version = "0.1.0"
description = "Bravo audit forwarder (T24, FR-14): platform API events -> S3 Object Lock (AWS S3 or Ceph RGW)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.123",
  "httpx==0.28.1",
]

[project.scripts]
bravo-audit = "bravo_audit.__main__:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["s3: writes to a real Object Lock bucket named by BRAVO_TEST_AUDIT_BUCKET"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
