[project]
name = "bravo-apply"
version = "0.1.0"
description = "T31 approved-change apply path: trusted build, SBOM, scan, OpenBao transit signing, digest-gated deploy, scoped policy apply, gate re-check. Deterministic, no LLM (NFR-5)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.3.6",
]

[project.scripts]
bravo-apply = "bravo_apply.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_apply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pg: runs against a throwaway postgres:16 container with the platform/api migrations",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
