# Static console. Listens on 8080 as the unprivileged nginx user (uid 101).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Written at container start from BRAVO_API_BASE (docker/40-bravo-config.sh).
    location = /config.json {
        alias /tmp/bravo/config.json;
        default_type application/json;
        include /etc/nginx/bravo-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Read-only GET proxy to pilot services (/svc/<name>/), written at start by 40-bravo-config.sh.
    include /tmp/bravo/proxy.conf;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/bravo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/bravo-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
