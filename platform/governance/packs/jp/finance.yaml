        note: 스펙의 "2.6"은 맞습니다. 정확한 위치는 2.6의 "対応が望ましい事項" d입니다. 기본 대응 사항이 아니라 대형 금융기관이 참조할 권장 사항이고, 법적 의무가 아닙니다. 2025-07-04 개정은 기관명만 바꿔 번호는 같습니다.
      - source: 金融庁 金融分野におけるサイバーセキュリティに関するガイドライン(2024-10-04 제정, 2025-07-04 개정)
        title: "2.3.4.5. クラウドサービス利用時の対策"
        clause: "2.3.4.5 【基本的な対応事項】⑥"
        url: https://www.fsa.go.jp/common/law/cybersecurity_guideline.pdf
        retrieved_at: "2026-11-02T20:22+09:00"
        status: confirmed
        note: 클라우드 이용 종료 때 데이터 취급(논리적 폐기)을 확인하라고 합니다.
      - source: 金融庁 ディスカッション・ペーパー「オペレーショナル・レジリエンス確保に向けた基本的な考え方」(2023-04)
        title: "BOX7 サードパーティリスク管理②（代替手段・出口戦略の確保）"
        clause: "III장 BOX7(본문 21–22쪽)"
        url: https://www.fsa.go.jp/news/r4/ginkou/20230427/02.pdf
        retrieved_at: "2026-11-02T20:15+09:00"
        status: confirmed
        quote: "現状では困難との声が多く聞かれている"
        note: 멀티 클라우드는 클라우드마다 다른 사양에 대응할 인력의 육성 · 채용 비용 때문에 어렵다는 업계 의견을 소개합니다. 금융청의 요구가 아니라 의견 소개입니다. 조항이 아니므로 판정 근거로 쓰지 않고 배경으로만 씁니다.

