        retrieved_at: "2026-11-02T20:22+09:00"
        status: confirmed
        note: 계약으로 데이터 비취급을 정하고 접근 제어를 하면 제28조의 제공에 해당하지 않는다고 답합니다. 해당 여부 판단은 사람이 합니다.

