export:
  - data_kind: 개인 데이터(個人データ)
    condition: 외국에 있는 제3자에게 제공하면 본인 동의 등 제28조 요건이 필요합니다. 외국 사업자가 저장된 데이터를 취급하지 않으면 "제공"이 아닙니다. 이때도 안전관리 조치는 남습니다.
    basis:
      - source: 個人情報の保護に関する法律(평성15년 법률 제57호, e-Gov 현행판 2026-11-02 시행)
