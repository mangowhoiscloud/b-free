      - source: 金融庁 金融分野におけるサイバーセキュリティに関するガイドライン(2024-10-04 제정, 2025-07-04 개정)
        title: "2.2.5. 演習・訓練"
        clause: "2.2.5 【対応が望ましい事項】a"
        url: https://www.fsa.go.jp/common/law/cybersecurity_guideline.pdf
        retrieved_at: "2026-11-02T20:22+09:00"
        status: confirmed
        note: 실기 복구 훈련에서 복구 절차와 RPO · RTO의 타당성을 확인하라는 권장 사항입니다.
      - source: 金融庁 金融分野におけるサイバーセキュリティに関するガイドライン(2024-10-04 제정, 2025-07-04 개정)
        title: "2.6. サードパーティリスク管理"
        clause: "2.6 【対応が望ましい事項】d"
        url: https://www.fsa.go.jp/common/law/cybersecurity_guideline.pdf
        retrieved_at: "2026-11-02T20:22+09:00"
        status: confirmed
