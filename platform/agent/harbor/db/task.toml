# Harbor 0.25.0 task (schema_version 1.4). 필드는 harbor.models.task.config.TaskConfig로 검증합니다(tests/test_harbor_tasks.py).
# 리허설 서비스가 Trial마다 이 템플릿을 복사하고 tests/expected.json과 /src 스냅샷을 넣습니다.
schema_version = "1.4"
# 검증기로 넘어가는 것은 제안서 파일 하나뿐입니다. reward 경로(/logs/verifier)는 검증기 환경에만 있습니다.
artifacts = ["/out/proposal.json"]

[task]
name = "bravo/db"
version = "0.1.0"
description = "Bravo db proposal task (proposal only; the state machine decides)."

[environment]
# 로컬 빌드 digest(images/build.sh). GHCR push 뒤에는 ghcr.io 경로 + 같은 방식의 digest로 바꿉니다.
docker_image = "bravo/agent-sandbox-governance-agent@sha256:249b2f6d64f1580d999fa74af02e71ca3188ae02e7647c14d35a5e16180acc1b"
workdir = "/work"
network_mode = "no-network"   # D-26: 샌드박스는 DB에 닿지 않음. SQL 리허설은 도구 계층의 db_rehearse(서버 쪽)

[agent]
network_mode = "no-network"   # D-26: 샌드박스는 DB에 닿지 않음. SQL 리허설은 도구 계층의 db_rehearse(서버 쪽)
timeout_sec = 600
user = "65532"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 120

[verifier.environment]
# 검증기 이미지는 에이전트 샌드박스와 다릅니다. 표준 라이브러리 Python만 씁니다.
docker_image = "python:3.12.16-slim-trixie@sha256:8523d6abeb48ceae0b7240d30c5808fc26cb79c1a635bacdf19cf3baecfbec07"
network_mode = "no-network"
