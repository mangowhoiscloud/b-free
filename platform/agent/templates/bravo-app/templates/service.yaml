apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/managed-by: bravo-platform }
spec:
  selector: { app.kubernetes.io/name: {{ .Release.Name }} }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
automountServiceAccountToken: false
