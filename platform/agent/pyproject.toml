[project]
name = "bravo-agents"
version = "0.1.0"
description = "Role-separated migration agents on an Agent SDK (Claude Agent SDK, OpenAI Agents SDK). Proposals only; the state machine decides and executes."
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.176",
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# openai_agents provider: the OpenAI Agents SDK as a second engine behind the same contract (13 6).
# The credential comes from the platform OpenBao at run time: an API key, or (demo only) the lead's ChatGPT
# session on the undocumented Codex backend (bravo_agents/chatgpt_auth.py, ADR 0009).
# 0.20.0 is the newest release on openai<3: harbor 0.25.0 pulls litellm, which needs openai<3 (0.21+ needs openai>=3).
openai = ["openai-agents==0.20.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bravo_agents = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
