[project]
name = "bravo-agents"
version = "0.1.0"
description = "Role-separated migration agents on the Claude Agent SDK. Proposals only; the state machine decides and executes."
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.176",
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# Pilot/demo only: codex_chatgpt provider (operator ChatGPT login via the Codex SDK). Pulls the
# matching Codex runtime wheel (openai-codex-cli-bin==0.157.0, same as the operator CLI).
codex = ["openai-codex==0.157.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bravo_agents = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
