apiVersion: bravo.agent/v1
kind: AgentAllowlist
role: db
description: Checks PostgreSQL readiness and plans logical decoding, PgBouncer insertion and sequence alignment.
responsibility:
  does:
    - Check schema, extensions, collation, primary keys, sequences, logical decoding, slots and lag from read-only facts.
    - Plan logical-decoding enablement for RDS or Cloud SQL (parameter group or flag change), PgBouncer insertion and sequence alignment.
    - Rehearse proposed SQL only through db_rehearse, which runs it on the synthetic database of this trial.
  never:
    - Run DDL or DML on a real source or destination database (the tool layer has no such path).
    - Drop slots, publications or subscriptions; request it in slot_cleanup_request for a person.
states: [ANALYZE, WATCH]
model_tier: opus
limits: { max_turns: 30, max_budget_usd: 2.0, timeout_s: 600, max_attempts: 3 }
mcp_tools: [inventory_describe, db_inspect, db_rehearse, rehearsal_exec]
# D-26: 샌드박스에는 DB 접속 값이 없습니다. db_inspect(실제 DB, 읽기 전용 역할 · 고정 SQL)와
# db_rehearse(이 Trial의 합성 DB, 단일 트랜잭션)는 도구 계층이 서버 쪽에서 OpenBao의 자격으로 실행하고,
# 결과(행, 오류 코드)만 돌려줍니다. 접속 문자열과 자격은 모델에게 가지 않습니다.
db_queries: [server_version, settings_replication, extensions, collations, tables_without_pk,
             replica_identity, sequences, publications, subscriptions, replication_slots, replication_lag]
sandbox:
  image: bravo/agent-sandbox-governance-agent   # 파일 작업만 필요. psql 이미지(images/db-agent)는 도구 계층의 DB 러너가 씀
  user: 65532
  egress: [llm-gateway, tool-layer]
  binaries: [sh, cat, ls, base64, jq]
  ops: [read_file, list_dir, write_file, run_check]
  paths: { read: [/src, /work, /out], write: [/work, /out] }
  write_max_bytes: 131072
  checks:
    json_syntax:
      argv: [jq, empty, "{path}"]
      params: { path: { kind: path, under: [/work, /out] } }
      timeout_s: 10
