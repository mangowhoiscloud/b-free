[project]
name = "bravo-api"
version = "0.1.0"
description = "Bravo platform API, state machine, gate, SSE events and operator MCP server (T10, D-18)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "pyjwt[crypto]==2.15.1",
  "mcp==2.3.0",
  "sse-starlette==3.6.0",
  "httpx>=0.28,<1",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
  "opentelemetry-instrumentation-fastapi",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_api"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S608", "S105"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S106", "S105"]
