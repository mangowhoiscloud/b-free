[project]
name = "bravo-executor"
version = "0.1.0"
description = "Bravo Cutover Executor: logical-replication cutover, effect ledger, integrity receipt (T12, T13, §8.6)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
  "boto3==1.43.123",
  "httpx==0.28.1",
]

[project.scripts]
bravo-executor = "bravo_executor.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28,<1", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S608"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]
