# Reverse tunnel relay (임시 링크(D-16 전)). reverse-relay.yaml is generated: `bravo-link render-relay`.
# Pin the python3 image by digest before applying, e.g.
#   kustomize edit set image bravo-link-relay=<account>.dkr.ecr.ap-northeast-2.amazonaws.com/<repo>@sha256:<digest>
#   kubectl --context bravo-source apply -k tools/link/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - reverse-relay.yaml
