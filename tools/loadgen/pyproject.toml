[project]
name = "bravo-loadgen"
version = "0.1.0"
description = "Bravo chat write load generator with idempotent retries and NFR-2 verification (T18)"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]==3.3.6"]

[project.scripts]
bravo-loadgen = "bravo_loadgen.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bravo_loadgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S608"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]
