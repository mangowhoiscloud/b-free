# One load run inside the platform cluster (tools/loadgen app mode). deploy/cloud/load_lib.sh replaces the
# @...@ fields, applies it, copies /out when the run ends and deletes the Job. It is a run, like a test Pod,
# not an Argo CD resource. Why here: the operator Mac must not run the load (11/3 02:44 it held ~9,400 sockets
# and kubectl failed with "can't assign requested address"). The app is still reached through its public name
# and Cloudflare, like a user; OTLP goes straight to the platform Collector (README "지표 계약").
# Image: built with buildx (linux/arm64) from tools/loadgen, pushed to the platform ECR, pinned here by digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-@RUN8@
  namespace: bravo-control
  labels: {app.kubernetes.io/name: bravo-loadgen, bravo.io/run-id: "@RUN_ID@"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: @DEADLINE_S@
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: bravo-loadgen, bravo.io/run-id: "@RUN_ID@"}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{name: ecr-pull}]
      nodeSelector: {bravo.io/pool: core}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          # l1-20261102T182044Z
          image: 721622471953.dkr.ecr.ap-northeast-2.amazonaws.com/bravo-platform/loadgen@sha256:66f0abdf7af2b1f3c807b35ff71abdf46d2994d4fa659ac2b841c1e6406b4ecd
          command: ["sh", "-c"]
          # SIGTERM (load_lib.sh loadgen_job_stop) reaches the loadgen, which stops sending and drains. The files
          # stay until the script has copied them (/out/collected) or 30 minutes pass.
          args:
            - |
              python -m bravo_loadgen > /out/summary.json 2> /out/events.jsonl &
              pid=$!
              trap 'kill -TERM "$pid" 2>/dev/null' TERM
              wait "$pid"; rc=$?
              while kill -0 "$pid" 2>/dev/null; do wait "$pid"; rc=$?; done
              echo "$rc" > /out/exit
              touch /out/done
              i=0; while [ ! -f /out/collected ] && [ "$i" -lt 1800 ]; do sleep 2; i=$((i + 2)); done
          env:
            - {name: LOADGEN_APP_URL, value: "@APP_URL@"}
            - {name: LOADGEN_WRITE_RATE, value: "@WRITE_RATE@"}
            - {name: LOADGEN_READ_RATE, value: "@READ_RATE@"}
            - {name: LOADGEN_DURATION_S, value: "@DURATION_S@"}
            - {name: LOADGEN_WORKERS, value: "@WORKERS@"}
            - {name: LOADGEN_RUN_ID, value: "@RUN_ID@"}
            - {name: LOADGEN_PLAN_ID, value: "@PLAN_ID@"}
            - {name: LOADGEN_OTLP_ENDPOINT, value: "http://otel-collector.bravo-observe.svc:4318"}
            - {name: LOADGEN_REQUESTS_FILE, value: /out/requests.jsonl}
            - {name: LOADGEN_TIMELINE_FILE, value: /out/timeline.jsonl}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 3Gi}  # 2 of the platform node's 4 cores at most (03:09 run: 2.2 cores)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: out, mountPath: /out}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: out, emptyDir: {sizeLimit: 512Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
